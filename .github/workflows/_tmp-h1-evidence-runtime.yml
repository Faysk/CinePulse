name: Temporary H1 Evidence Runtime Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h1-evidence-runtime.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Wire verified CPU tuning cache into render runtime
        shell: python
        run: |
          from pathlib import Path

          studio = Path('src/cinepulse/studio.py')
          text = studio.read_text(encoding='utf-8')
          anchor = 'from .resource_scheduler import detect_cpu_topology, schedule_cpu_threads\n'
          import_line = 'from .cpu_tuning import CpuTuningKey, CpuTuningStore\n'
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('resource scheduler import anchor missing')
              text = text.replace(anchor, anchor + import_line, 1)

          old = '''            cpu_topology = detect_cpu_topology()\n            dedicated_threshold = max(1, cpu_topology.logical_cpus - (2 if cpu_topology.logical_cpus >= 8 else 1))\n            machine_mode = "dedicated" if settings.cpu_threads >= dedicated_threshold else "balanced"\n\n            def stage_threads(stage: str, *, gpu_active: bool = False) -> int:\n                plan = schedule_cpu_threads(\n                    stage, topology=cpu_topology, mode=machine_mode, gpu_active=gpu_active,\n                    max_threads=settings.cpu_threads,\n                )\n                self._log(\n                    f"H1 CPU {stage}: {plan.threads}/{plan.logical_cpus} threads "\n                    f"(cap {settings.cpu_threads}, {machine_mode}; {plan.reason})"\n                )\n                return plan.threads\n'''
          new = '''            cpu_topology = detect_cpu_topology()\n            dedicated_threshold = max(1, cpu_topology.logical_cpus - (2 if cpu_topology.logical_cpus >= 8 else 1))\n            machine_mode = "dedicated" if settings.cpu_threads >= dedicated_threshold else "balanced"\n            cpu_tuning = CpuTuningStore(PATHS.cache / "hardware" / "cpu-tuning.json")\n\n            def stage_threads(stage: str, *, gpu_active: bool = False) -> int:\n                plan = schedule_cpu_threads(\n                    stage, topology=cpu_topology, mode=machine_mode, gpu_active=gpu_active,\n                    max_threads=settings.cpu_threads,\n                )\n                tuning_key = CpuTuningKey.from_topology(\n                    stage, cpu_topology, mode=machine_mode, gpu_active=gpu_active,\n                )\n                proven = cpu_tuning.lookup(tuning_key, max_threads=settings.cpu_threads)\n                if proven is not None:\n                    self._log(\n                        f"H1 CPU {stage}: usando política medida {proven}/{plan.logical_cpus} threads "\n                        f"(cap {settings.cpu_threads}, {machine_mode}; integridade aprovada)."\n                    )\n                    return proven\n                self._log(\n                    f"H1 CPU {stage}: {plan.threads}/{plan.logical_cpus} threads "\n                    f"(cap {settings.cpu_threads}, {machine_mode}; sem evidência medida aplicável; {plan.reason})"\n                )\n                return plan.threads\n'''
          if 'cpu_tuning = CpuTuningStore(' not in text:
              if old not in text:
                  raise SystemExit('stage_threads runtime anchor missing')
              text = text.replace(old, new, 1)
          studio.write_text(text, encoding='utf-8')

          docs = Path('docs/HARDWARE_UTILIZATION_PHASE2.md')
          text = docs.read_text(encoding='utf-8')
          section = '''\n## Integrity-gated measured autotuning\n\nH1 can now consume a local `cpu-tuning.json` evidence cache keyed by exact stage, logical/physical topology, machine mode and whether the stage is feeding an active GPU path. The benchmark CLI records a winner only when at least one candidate has an explicit integrity PASS; a faster failed candidate can never win. Corrupt, missing, mismatched or over-cap evidence is ignored and the conservative topology scheduler remains the fallback.\n\nCI proves the policy contracts only. The repository still claims no physical throughput or thermal PASS until the representative workloads are run on real hardware and their telemetry is recorded.\n'''
          if '## Integrity-gated measured autotuning' not in text:
              text = text.rstrip() + '\n' + section
          docs.write_text(text, encoding='utf-8')
      - name: Focused H1 gates
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_cpu_tuning tests.test_resource_scheduler tests.test_performance_policy
      - name: Commit source integration
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/cinepulse/studio.py docs/HARDWARE_UTILIZATION_PHASE2.md
          git commit -m "Hardware H1: consume verified CPU tuning evidence"
          git push origin HEAD:preview-restoration-lab
