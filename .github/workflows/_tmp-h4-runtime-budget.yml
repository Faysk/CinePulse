name: Temporary Hardware H4 Runtime Budget Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h4-runtime-budget.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Integrate live H4 budgets into neural chunk sizing
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/cinepulse/studio.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from .rife_engine import RifePaths, build_command as build_rife_command, target_frame_count\n'
          import_insert = (
              'from .rife_engine import RifePaths, build_command as build_rife_command, target_frame_count\n'
              'from .pipeline_budget import derive_pipeline_budget\n'
              'from .pipeline_runtime import measure_resource_headroom\n'
          )
          if 'from .pipeline_runtime import measure_resource_headroom' not in text:
              if import_anchor not in text:
                  raise SystemExit('H4 import anchor not found')
              text = text.replace(import_anchor, import_insert, 1)

          budget_anchor = '''            machine_mode = "dedicated" if settings.cpu_threads >= dedicated_threshold else "balanced"
              cpu_tuning = CpuTuningStore(PATHS.cache / "hardware" / "cpu-tuning.json")
  '''
          budget_block = '''            machine_mode = "dedicated" if settings.cpu_threads >= dedicated_threshold else "balanced"
              cpu_tuning = CpuTuningStore(PATHS.cache / "hardware" / "cpu-tuning.json")

              neural_steps_active = bool(
                  render_plan.step("enhancement").attempts
                  or render_plan.step("rife_base").runs
                  or render_plan.step("rife_final").attempts
              )
              neural_headroom = measure_resource_headroom(
                  job_dir,
                  gpu_index=0,
                  probe_write=neural_steps_active,
                  probe_size_mb=32,
              )
              h4_common = dict(
                  ram_available_gb=neural_headroom.ram_available_gb,
                  vram_free_mb=neural_headroom.vram_free_mb,
                  scratch_free_gb=neural_headroom.scratch_free_gb,
                  scratch_write_mbps=neural_headroom.scratch_write_mbps,
                  dedicated=(machine_mode == "dedicated"),
              )
              realesrgan_budget = derive_pipeline_budget("realesrgan", **h4_common)
              rife_budget = derive_pipeline_budget("rife", **h4_common)
              self._log(
                  "H4 HEADROOM: "
                  f"RAM={neural_headroom.ram_available_gb if neural_headroom.ram_available_gb is not None else 'n/a'} GiB • "
                  f"VRAM livre={neural_headroom.vram_free_mb if neural_headroom.vram_free_mb is not None else 'n/a'} MiB • "
                  f"scratch livre={neural_headroom.scratch_free_gb:.2f} GiB • "
                  f"write={neural_headroom.scratch_write_mbps if neural_headroom.scratch_write_mbps is not None else 'n/a'} MB/s • "
                  f"probe={neural_headroom.probe_bytes / (1024 ** 2):.0f} MiB"
              )
              self._log(f"H4 Real-ESRGAN budget: {realesrgan_budget.reason}")
              self._log(f"H4 RIFE budget: {rife_budget.reason}")
  '''
          if 'H4 HEADROOM:' not in text:
              if budget_anchor not in text:
                  raise SystemExit('H4 budget insertion anchor not found')
              text = text.replace(budget_anchor, budget_block, 1)

          enhance_signature = '''        cpu_threads: int, base: float, weight: float, *, cache_source_video: str | None = None,
          cache_quota_gb: float = 50.0,
      ) -> tuple[str, int, int]:
  '''
          enhance_new_signature = '''        cpu_threads: int, base: float, weight: float, *, cache_source_video: str | None = None,
          cache_quota_gb: float = 50.0, chunk_budget_gb: float = 4.0,
      ) -> tuple[str, int, int]:
  '''
          if 'cache_quota_gb: float = 50.0, chunk_budget_gb:' not in text:
              if enhance_signature not in text:
                  raise SystemExit('Real-ESRGAN signature anchor not found')
              text = text.replace(enhance_signature, enhance_new_signature, 1)

          enhance_chunk = '''        chunk_frames = choose_chunk_frames(
              FrameSpec(source_w, source_h, source_fps, "RGBA/PNG"),
              FrameSpec(source_w * 2, source_h * 2, source_fps, "RGBA/PNG"),
          )
  '''
          enhance_chunk_new = '''        chunk_frames = choose_chunk_frames(
              FrameSpec(source_w, source_h, source_fps, "RGBA/PNG"),
              FrameSpec(source_w * 2, source_h * 2, source_fps, "RGBA/PNG"),
              budget_gb=max(0.5, float(chunk_budget_gb)),
          )
  '''
          if 'budget_gb=max(0.5, float(chunk_budget_gb))' not in text:
              if enhance_chunk not in text:
                  raise SystemExit('Real-ESRGAN chunk anchor not found')
              text = text.replace(enhance_chunk, enhance_chunk_new, 1)

          rife_signature = '''        *,
          color_plan: ColorPipeline,
      ) -> str:
  '''
          rife_new_signature = '''        *,
          color_plan: ColorPipeline,
          chunk_budget_gb: float = 4.0,
      ) -> str:
  '''
          if 'color_plan: ColorPipeline,\n        chunk_budget_gb: float = 4.0,' not in text:
              if rife_signature not in text:
                  raise SystemExit('RIFE signature anchor not found')
              text = text.replace(rife_signature, rife_new_signature, 1)

          rife_chunk = '''        chunk_frames = choose_chunk_frames(
              FrameSpec(frame_w, frame_h, source_fps, "RGBA/PNG"),
              FrameSpec(frame_w, frame_h, target_fps, "RGBA/PNG"),
              output_frames_per_input=ratio,
          )
  '''
          rife_chunk_new = '''        chunk_frames = choose_chunk_frames(
              FrameSpec(frame_w, frame_h, source_fps, "RGBA/PNG"),
              FrameSpec(frame_w, frame_h, target_fps, "RGBA/PNG"),
              budget_gb=max(0.5, float(chunk_budget_gb)),
              output_frames_per_input=ratio,
          )
  '''
          if rife_chunk not in text and 'output_frames_per_input=ratio' in text and text.count('budget_gb=max(0.5, float(chunk_budget_gb))') < 2:
              raise SystemExit('RIFE chunk anchor not found')
          if rife_chunk in text:
              text = text.replace(rife_chunk, rife_chunk_new, 1)

          def inject_call_kwarg(source: str, marker: str, keyword_line: str, *, occurrence_limit: int = 20) -> str:
              cursor = 0
              count = 0
              while True:
                  start = source.find(marker, cursor)
                  if start < 0:
                      break
                  depth = 0
                  close = None
                  index = start + len(marker) - 1
                  while index < len(source):
                      char = source[index]
                      if char == '(':
                          depth += 1
                      elif char == ')':
                          depth -= 1
                          if depth == 0:
                              close = index
                              break
                      index += 1
                  if close is None:
                      raise SystemExit(f'unclosed call for {marker}')
                  call = source[start:close + 1]
                  if 'chunk_budget_gb=' not in call:
                      indent_start = source.rfind('\n', start, close) + 1
                      close_line = source[source.rfind('\n', start, close) + 1:close]
                      close_indent = close_line[: len(close_line) - len(close_line.lstrip())]
                      insertion = close_indent + '    ' + keyword_line + '\n'
                      source = source[:close] + insertion + source[close:]
                      close += len(insertion)
                  cursor = close + 1
                  count += 1
                  if count > occurrence_limit:
                      raise SystemExit(f'too many calls for {marker}')
              return source

          text = inject_call_kwarg(
              text,
              'self._enhance_clip_ai(',
              'chunk_budget_gb=realesrgan_budget.chunk_budget_gb,',
          )
          text = inject_call_kwarg(
              text,
              'self._interpolate_rife(',
              'chunk_budget_gb=rife_budget.chunk_budget_gb,',
          )

          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Focused H4 tests
        run: |
          python -m pip install --disable-pip-version-check --editable .
          python -m unittest discover -s tests -p 'test_pipeline_budget.py'
          python -m unittest discover -s tests -p 'test_pipeline_runtime.py'
          python -m unittest discover -s tests -p 'test_realesrgan_tuning.py'
          python -m unittest discover -s tests -p 'test_rife_tuning.py'
          python -m unittest discover -s tests -p 'test_rife_safe_runner.py'
          python -m compileall -q src/cinepulse
      - name: Commit integration and remove temporary writer
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp-h4-runtime-budget.yml
          git add src/cinepulse/studio.py
          git commit -m "Hardware H4: apply live budgets to neural chunks"
          git push origin HEAD:preview-restoration-lab
