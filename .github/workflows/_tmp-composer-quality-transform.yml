name: Temporary Composer Quality Transform Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-composer-quality-transform.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch CPU reference runtime to bilinear transforms
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/cinepulse/composer_runtime.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from .visualizer_renderer import VisualizerColor, render_visualizer_rgba\n'
          addition = 'from .composer_resample import resize_bilinear_rgba, rotate_bilinear_rgba\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('composer runtime import anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          start = text.index('def _resample_nearest(')
          end = text.index('\ndef transform_overlay(', start)
          text = text[:start] + text[end+1:]
          text = text.replace('    overlay = _resample_nearest(overlay, target_w, target_h)\n    overlay = _rotate_nearest(overlay, state.rotation_degrees)\n', '    overlay = resize_bilinear_rgba(overlay, target_w, target_h)\n    overlay = rotate_bilinear_rgba(overlay, state.rotation_degrees)\n', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
      - run: python -m pip install --disable-pip-version-check --editable .
      - name: Focused quality/reference gate
        run: |
          python -m compileall -q src/cinepulse/composer_runtime.py src/cinepulse/composer_resample.py src/cinepulse/composer_decode.py
          python -m unittest tests.test_composer_resample tests.test_composer_runtime tests.test_composer_decode tests.test_composer_media tests.test_overlay_composer tests.test_visualizer_geometry tests.test_visualizer_renderer
      - name: Integrate and remove writer
        if: ${{ success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cinepulse/composer_runtime.py
          git rm .github/workflows/_tmp-composer-quality-transform.yml
          git commit -m "Preview composer: use quality-first bilinear reference transforms"
          git push origin HEAD:preview-restoration-lab
      - name: Remove failed temporary writer
        if: ${{ failure() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin preview-restoration-lab || true
          git rm -f .github/workflows/_tmp-composer-quality-transform.yml || true
          git commit -m "chore: remove failed composer quality transform gate" || true
          git push origin HEAD:preview-restoration-lab || true
