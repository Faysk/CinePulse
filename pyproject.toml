[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cinepulse-studio"
version = "1.0.0rc2"
description = "Local AI video enhancement and music-reactive visual studio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Faysk"}]
dependencies = ["numpy>=2.0,<3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
cinepulse = "cinepulse.app:main"
cinepulse-diagnostics = "cinepulse.diagnostics:write_report"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cinepulse = ["resources/*.json"]


[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["components", ".runtime", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
