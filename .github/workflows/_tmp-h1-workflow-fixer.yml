name: Temporary H1 Workflow Fixer

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h1-workflow-fixer.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
          fetch-depth: 0
      - name: Fix focused-test import path
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/_tmp-h1-runtime.yml')
          text = path.read_text(encoding='utf-8')
          old = '        run: python -m unittest tests.test_resource_scheduler tests.test_performance_policy\n'
          new = '        run: PYTHONPATH=src python -m unittest tests.test_resource_scheduler tests.test_performance_policy\n'
          if old not in text and new not in text:
              raise SystemExit('H1 test command anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp-h1-workflow-fixer.yml
          git add .github/workflows/_tmp-h1-runtime.yml
          git commit -m "chore: fix H1 integrator test path"
          git push origin HEAD:preview-restoration-lab
