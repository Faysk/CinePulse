name: Temporary Composer Audio Sources

on:
  push:
    branches:
      - preview-restoration-lab
    paths:
      - .github/workflows/_tmp-composer-audio-sources.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
          fetch-depth: 0
      - name: Patch Preview composer audio sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'src/cinepulse/overlay_composer.py',
              '''COMPOSER_SCHEMA = 1\nVisualizerKind = Literal["waveform", "spectrum", "circular"]\nVisualizerBinding = Literal["master", "vocals", "drums", "bass", "other"]\nExecutionRoute = Literal["cuda-overlay", "cpu-overlay", "cpu-visualizer"]\n''',
              '''COMPOSER_SCHEMA = 2\nLEGACY_COMPOSER_SCHEMA = 1\nAUDIO_SOURCE_BINDINGS = ("master", "vocals", "drums", "bass", "other")\nVisualizerKind = Literal["waveform", "spectrum", "circular"]\nVisualizerBinding = Literal["master", "vocals", "drums", "bass", "other"]\nExecutionRoute = Literal["cuda-overlay", "cpu-overlay", "cpu-visualizer"]\n''',
          )

          old_state = '''@dataclass\nclass OverlayComposerState:\n    items: list[ComposerItem] = field(default_factory=list)\n\n    def add(self, item: ComposerItem) -> None:\n        if any(existing.id == item.id for existing in self.items):\n            raise ValueError(f"duplicate composer item id: {item.id}")\n        self.items.append(item)\n\n    def remove(self, item_id: str) -> bool:\n        before = len(self.items)\n        self.items[:] = [item for item in self.items if item.id != item_id]\n        return len(self.items) != before\n\n    def ordered(self) -> tuple[ComposerItem, ...]:\n        return tuple(sorted((item for item in self.items if item.enabled), key=lambda item: (item.z_order, item.id)))\n\n    def as_dict(self) -> dict[str, object]:\n        return {"schema": COMPOSER_SCHEMA, "items": [asdict(item) for item in self.items]}\n\n    @classmethod\n    def from_dict(cls, payload: object) -> "OverlayComposerState":\n        if not isinstance(payload, dict) or payload.get("schema") != COMPOSER_SCHEMA:\n            raise ValueError("unsupported overlay composer schema")\n        raw_items = payload.get("items")\n        if not isinstance(raw_items, list):\n            raise ValueError("overlay composer items must be a list")\n        state = cls()\n        for raw in raw_items:\n            if not isinstance(raw, dict):\n                raise ValueError("overlay composer item must be an object")\n            item_id = str(raw.get("id") or "").strip()\n            enabled = bool(raw.get("enabled", True))\n            media_raw = raw.get("media")\n            visualizer_raw = raw.get("visualizer")\n            if bool(media_raw) == bool(visualizer_raw):\n                raise ValueError("persisted composer item must contain exactly one layer")\n            media = OverlayLayer(**media_raw) if isinstance(media_raw, dict) else None\n            visualizer = VisualizerLayer(**visualizer_raw) if isinstance(visualizer_raw, dict) else None\n            state.add(ComposerItem(item_id, media=media, visualizer=visualizer, enabled=enabled))\n        return state\n'''

          new_state = '''@dataclass\nclass OverlayComposerState:\n    items: list[ComposerItem] = field(default_factory=list)\n    audio_sources: dict[str, str] = field(default_factory=dict)\n\n    def __post_init__(self) -> None:\n        normalized: dict[str, str] = {}\n        for binding, source in dict(self.audio_sources).items():\n            key = self._audio_binding(binding)\n            value = str(source or "").strip()\n            if not value:\n                raise ValueError(f"composer audio source for {key} cannot be empty")\n            normalized[key] = value\n        self.audio_sources.clear()\n        self.audio_sources.update(normalized)\n\n    @staticmethod\n    def _audio_binding(binding: object) -> str:\n        value = str(binding or "").strip().lower()\n        if value not in AUDIO_SOURCE_BINDINGS:\n            raise ValueError(f"unsupported composer audio binding: {value or '<empty>'}")\n        return value\n\n    def set_audio_source(self, binding: object, source: str | Path) -> None:\n        key = self._audio_binding(binding)\n        value = str(Path(source).expanduser()).strip()\n        if not value:\n            raise ValueError(f"composer audio source for {key} cannot be empty")\n        self.audio_sources[key] = value\n\n    def clear_audio_source(self, binding: object) -> bool:\n        key = self._audio_binding(binding)\n        return self.audio_sources.pop(key, None) is not None\n\n    def resolved_audio_sources(self, master_source: str | Path) -> dict[str, str]:\n        resolved = dict(self.audio_sources)\n        if not resolved.get("master"):\n            resolved["master"] = str(Path(master_source).expanduser())\n        return resolved\n\n    def add(self, item: ComposerItem) -> None:\n        if any(existing.id == item.id for existing in self.items):\n            raise ValueError(f"duplicate composer item id: {item.id}")\n        self.items.append(item)\n\n    def remove(self, item_id: str) -> bool:\n        before = len(self.items)\n        self.items[:] = [item for item in self.items if item.id != item_id]\n        return len(self.items) != before\n\n    def ordered(self) -> tuple[ComposerItem, ...]:\n        return tuple(sorted((item for item in self.items if item.enabled), key=lambda item: (item.z_order, item.id)))\n\n    def as_dict(self) -> dict[str, object]:\n        return {\n            "schema": COMPOSER_SCHEMA,\n            "items": [asdict(item) for item in self.items],\n            "audio_sources": dict(sorted(self.audio_sources.items())),\n        }\n\n    @classmethod\n    def from_dict(cls, payload: object) -> "OverlayComposerState":\n        if not isinstance(payload, dict) or payload.get("schema") not in {LEGACY_COMPOSER_SCHEMA, COMPOSER_SCHEMA}:\n            raise ValueError("unsupported overlay composer schema")\n        raw_items = payload.get("items")\n        if not isinstance(raw_items, list):\n            raise ValueError("overlay composer items must be a list")\n        raw_audio = payload.get("audio_sources", {})\n        if not isinstance(raw_audio, dict):\n            raise ValueError("overlay composer audio_sources must be an object")\n        state = cls(audio_sources={str(key): str(value) for key, value in raw_audio.items()})\n        for raw in raw_items:\n            if not isinstance(raw, dict):\n                raise ValueError("overlay composer item must be an object")\n            item_id = str(raw.get("id") or "").strip()\n            enabled = bool(raw.get("enabled", True))\n            media_raw = raw.get("media")\n            visualizer_raw = raw.get("visualizer")\n            if bool(media_raw) == bool(visualizer_raw):\n                raise ValueError("persisted composer item must contain exactly one layer")\n            media = OverlayLayer(**media_raw) if isinstance(media_raw, dict) else None\n            visualizer = VisualizerLayer(**visualizer_raw) if isinstance(visualizer_raw, dict) else None\n            state.add(ComposerItem(item_id, media=media, visualizer=visualizer, enabled=enabled))\n        return state\n'''
          replace_once('src/cinepulse/overlay_composer.py', old_state, new_state)

          replace_once(
              'src/cinepulse/ui/composer_view.py',
              '''from ..overlay_composer import ComposerItem, OverlayComposerState, VisualizerLayer, media_layer_from_path\n''',
              '''from ..overlay_composer import (\n    AUDIO_SOURCE_BINDINGS,\n    ComposerItem,\n    OverlayComposerState,\n    VisualizerLayer,\n    media_layer_from_path,\n)\n''',
          )
          replace_once(
              'src/cinepulse/ui/composer_view.py',
              '''BINDINGS = ("master", "vocals", "drums", "bass", "other")\n''',
              '''BINDINGS = AUDIO_SOURCE_BINDINGS\n''',
          )

          audio_ui_anchor = '''    ttk.Button(actions, text="Remover", command=remove_selected).pack(side="right")\n\n    footer = ttk.Frame(shell)\n'''
          audio_ui = '''    ttk.Button(actions, text="Remover", command=remove_selected).pack(side="right")\n\n    audio_card = ttk.LabelFrame(list_card, text="Áudio / stems", padding=8)\n    audio_card.grid(row=2, column=0, columnspan=4, sticky="ew", pady=(9, 0))\n    audio_card.columnconfigure(1, weight=1)\n    audio_labels = {name: StringVar(value="") for name in BINDINGS}\n    audio_titles = {\n        "master": "Master",\n        "vocals": "Vocals",\n        "drums": "Drums",\n        "bass": "Bass",\n        "other": "Other",\n    }\n\n    def refresh_audio_sources() -> None:\n        source = _studio_source_path(studio)\n        for name in BINDINGS:\n            configured = state.audio_sources.get(name)\n            if configured:\n                path = Path(configured).expanduser()\n                suffix = " • ausente" if not path.is_file() else ""\n                audio_labels[name].set(f"{path.name}{suffix}")\n            elif name == "master":\n                label = source.name if source is not None else "vídeo fonte"\n                audio_labels[name].set(f"vídeo fonte • {label}")\n            else:\n                audio_labels[name].set("não configurado • fallback master")\n\n    def choose_audio_source(name: str) -> None:\n        path = filedialog.askopenfilename(\n            parent=window,\n            title=f"Selecionar áudio/stem — {audio_titles[name]}",\n            filetypes=(\n                ("Áudio/vídeo", "*.wav *.flac *.mp3 *.m4a *.aac *.ogg *.opus *.mka *.mkv *.mp4 *.mov *.webm"),\n                ("Todos", "*.*"),\n            ),\n        )\n        if not path:\n            return\n        try:\n            state.set_audio_source(name, path)\n            refresh_audio_sources()\n            status.set(f"{audio_titles[name]}: {Path(path).name}")\n        except ValueError as exc:\n            messagebox.showerror("Overlay Composer", str(exc), parent=window)\n\n    def clear_audio_source(name: str) -> None:\n        state.clear_audio_source(name)\n        refresh_audio_sources()\n        if name == "master":\n            status.set("Master voltou a usar o áudio do vídeo fonte.")\n        else:\n            status.set(f"{audio_titles[name]} removido • binding volta ao fallback master.")\n\n    for row, name in enumerate(BINDINGS):\n        ttk.Label(audio_card, text=audio_titles[name], width=8).grid(row=row, column=0, sticky="w", pady=2)\n        ttk.Label(audio_card, textvariable=audio_labels[name]).grid(row=row, column=1, sticky="ew", padx=(4, 6), pady=2)\n        ttk.Button(audio_card, text="Escolher…", command=lambda key=name: choose_audio_source(key)).grid(\n            row=row, column=2, padx=(0, 4), pady=2\n        )\n        ttk.Button(audio_card, text="Limpar", command=lambda key=name: clear_audio_source(key)).grid(\n            row=row, column=3, pady=2\n        )\n    ttk.Label(\n        audio_card,\n        text="Stems não configurados usam master; caminhos ficam salvos no projeto Preview.",\n    ).grid(row=len(BINDINGS), column=0, columnspan=4, sticky="w", pady=(5, 0))\n    refresh_audio_sources()\n\n    footer = ttk.Frame(shell)\n'''
          replace_once('src/cinepulse/ui/composer_view.py', audio_ui_anchor, audio_ui)

          replace_once(
              'src/cinepulse/ui/composer_view.py',
              '''            loaded = OverlayComposerState.load(Path(path))\n            state.items[:] = loaded.items\n            selected_id.set("")\n            refresh()\n''',
              '''            loaded = OverlayComposerState.load(Path(path))\n            state.items[:] = loaded.items\n            state.audio_sources.clear()\n            state.audio_sources.update(loaded.audio_sources)\n            selected_id.set("")\n            refresh_audio_sources()\n            refresh()\n''',
          )

          replace_once(
              'src/cinepulse/ui/composer_view.py',
              '''                    audio_sources={"master": source},\n                    max_width=960,\n''',
              '''                    audio_sources=snapshot.resolved_audio_sources(source),\n                    max_width=960,\n''',
          )
          replace_once(
              'src/cinepulse/ui/composer_view.py',
              '''                    audio_sources={"master": source},\n                )\n''',
              '''                    audio_sources=snapshot.resolved_audio_sources(source),\n                )\n''',
          )
          replace_once(
              'src/cinepulse/ui/composer_view.py',
              '''            "Prévia fiel limitada a 960×540; export CPU: FFV1 RGB lossless + áudio master. "\n            "Blend avançado cai no CPU; Stable intacto."\n''',
              '''            "Prévia fiel limitada a 960×540; export CPU: FFV1 RGB lossless + master/stems configurados. "\n            "Bindings sem stem usam master; Stable intacto."\n''',
          )

          replace_once(
              'tests/test_overlay_composer.py',
              '''            self.assertEqual(1, json.loads(path.read_text(encoding="utf-8"))["schema"])\n''',
              '''            self.assertEqual(2, json.loads(path.read_text(encoding="utf-8"))["schema"])\n''',
          )

          Path('tests/test_composer_audio_sources.py').write_text('''from __future__ import annotations\n\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nfrom cinepulse.gpu_compositor import OverlayLayer\nfrom cinepulse.overlay_composer import ComposerItem, OverlayComposerState\n\n\nclass ComposerAudioSourceStateTests(unittest.TestCase):\n    def test_schema_two_roundtrip_persists_named_audio_sources(self) -> None:\n        with tempfile.TemporaryDirectory() as temporary:\n            root = Path(temporary)\n            project = root / "composer.json"\n            state = OverlayComposerState(\n                [ComposerItem("logo", media=OverlayLayer("logo.png", "png"))],\n                audio_sources={"vocals": str(root / "vocals.wav"), "bass": str(root / "bass.flac")},\n            )\n            state.save(project)\n            restored = OverlayComposerState.load(project)\n            self.assertEqual(state.as_dict(), restored.as_dict())\n            self.assertEqual(2, restored.as_dict()["schema"])\n            self.assertTrue(str(restored.audio_sources["vocals"]).endswith("vocals.wav"))\n\n    def test_legacy_schema_one_loads_with_empty_audio_map(self) -> None:\n        restored = OverlayComposerState.from_dict(\n            {\n                "schema": 1,\n                "items": [\n                    {\n                        "id": "logo",\n                        "enabled": True,\n                        "media": {"source": "logo.png", "kind": "png"},\n                        "visualizer": None,\n                    }\n                ],\n            }\n        )\n        self.assertEqual({}, restored.audio_sources)\n        self.assertEqual(2, restored.as_dict()["schema"])\n\n    def test_master_defaults_to_video_source_and_custom_master_overrides(self) -> None:\n        state = OverlayComposerState()\n        resolved = state.resolved_audio_sources("movie.mkv")\n        self.assertEqual("movie.mkv", resolved["master"])\n        state.set_audio_source("master", "song.flac")\n        self.assertEqual("song.flac", state.resolved_audio_sources("movie.mkv")["master"])\n        self.assertTrue(state.clear_audio_source("master"))\n        self.assertEqual("movie.mkv", state.resolved_audio_sources("movie.mkv")["master"])\n\n    def test_unknown_binding_and_empty_persisted_source_fail_closed(self) -> None:\n        state = OverlayComposerState()\n        with self.assertRaises(ValueError):\n            state.set_audio_source("guitar", "guitar.wav")\n        with self.assertRaises(ValueError):\n            OverlayComposerState.from_dict({"schema": 2, "items": [], "audio_sources": {"vocals": ""}})\n        with self.assertRaises(ValueError):\n            OverlayComposerState.from_dict({"schema": 2, "items": [], "audio_sources": {"guitar": "x.wav"}})\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8', newline='\n')
          PY
      - name: Syntax check
        shell: bash
        run: python -m compileall -q src/cinepulse tests
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/_tmp-composer-audio-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cinepulse/overlay_composer.py src/cinepulse/ui/composer_view.py tests/test_overlay_composer.py tests/test_composer_audio_sources.py .github/workflows/_tmp-composer-audio-sources.yml
          git commit -m "Preview composer: persist master and stem audio sources"
          git push origin HEAD:preview-restoration-lab
