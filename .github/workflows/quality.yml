name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-matrix:
    name: Source · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14.7']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Source gate
        run: python scripts/ci_gate.py --profile source --output artifacts/ci/source-${{ runner.os }}-py${{ matrix.python }}.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-${{ runner.os }}-py${{ matrix.python }}
          path: artifacts/ci/*.json
          if-no-files-found: error

  cpu-integration:
    name: CPU integration · Linux · Python 3.14.7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          cache: pip
      - name: System media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb python3-tk
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: CPU integration gate
        run: python scripts/ci_gate.py --profile cpu --output artifacts/ci/cpu-linux-py3.14.7.json
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cpu-integration-linux-py3.14.7
          path: |
            artifacts/ci/*.json
            data/test-runs/**/report.json
          if-no-files-found: warn

  media-integration:
    name: Media integrity · Linux · Python 3.14.7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          cache: pip
      - name: System media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb python3-tk
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Media integration gate
        run: python scripts/ci_gate.py --profile media --output artifacts/ci/media-linux-py3.14.7.json
      - name: Upload media evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: media-integration-linux-py3.14.7
          path: |
            artifacts/ci/*.json
            data/test-runs/**/report.json
          if-no-files-found: warn
