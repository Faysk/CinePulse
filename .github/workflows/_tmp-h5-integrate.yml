name: Temporary Hardware H5 Runtime Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h5-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply H5 runtime integration
        run: python scripts/_tmp_h5_integrate.py
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Compile package
        run: python -m compileall -q src/cinepulse tests
      - name: H5 adaptive controller tests
        run: python -m unittest discover -s tests -p 'test_adaptive_runtime.py'
      - name: H4 overlap safety tests
        run: python -m unittest discover -s tests -p 'test_h4_overlap_contract.py'
      - name: Telemetry tests
        run: python -m unittest discover -s tests -p 'test_hardware_telemetry.py'
      - name: Render history tests
        run: python -m unittest discover -s tests -p 'test_render_history.py'
      - name: Commit integration and remove temporary writer
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp-h5-integrate.yml scripts/_tmp_h5_integrate.py
          git add src/cinepulse/studio.py src/cinepulse/hardware_telemetry.py src/cinepulse/render_history.py
          git commit -m "Hardware H5: integrate downshift-only runtime guard"
          git push origin HEAD:preview-restoration-lab
