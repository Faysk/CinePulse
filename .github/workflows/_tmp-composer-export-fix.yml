name: Temporary Composer Export Fix

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-composer-export-fix.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch FFmpeg contract and early failure diagnostics
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/cinepulse/composer_export.py')
          text = path.read_text(encoding='utf-8')
          old_vf = '''    vf = (
        f"zscale=matrixin=bt709:primariesin=bt709:transferin=bt709:rangein={range_in}:"
        "matrix=gbr:primaries=bt709:transfer=bt709:range=full,format=rgba"
    )'''
          new_vf = '''    vf = (
        f"zscale=matrixin=709:primariesin=709:transferin=709:rangein={range_in}:"
        "matrix=gbr:primaries=709:transfer=709:range=full,format=rgba"
    )'''
          if old_vf not in text:
              raise SystemExit('zscale anchor missing')
          text = text.replace(old_vf, new_vf, 1)
          old_short = '''                raw = _read_exact(decoder.stdout, frame_bytes)
                if len(raw) != frame_bytes:
                    raise RuntimeError(f"base decoder produced {len(raw)}/{frame_bytes} bytes at frame {index}")'''
          new_short = '''                raw = _read_exact(decoder.stdout, frame_bytes)
                if len(raw) != frame_bytes:
                    decode_stderr.flush()
                    code = decoder.poll()
                    details = decoder_log.read_text(encoding="utf-8", errors="replace")[-4000:]
                    suffix = f"; decoder exited with {code}" if code is not None else ""
                    raise RuntimeError(
                        (details.strip() + suffix) if details.strip() else
                        f"base decoder produced {len(raw)}/{frame_bytes} bytes at frame {index}{suffix}"
                    )'''
          if old_short not in text:
              raise SystemExit('short read anchor missing')
          text = text.replace(old_short, new_short, 1)
          old_finally = '''    finally:
        terminate_process_tree(decoder, logger, grace_seconds=1.5)
        terminate_process_tree(encoder, logger, grace_seconds=1.5)
        shutil.rmtree(temporary_dir, ignore_errors=True)'''
          new_finally = '''    finally:
        terminate_process_tree(decoder, logger, grace_seconds=1.5)
        terminate_process_tree(encoder, logger, grace_seconds=1.5)
        for stream in (
            getattr(decoder, "stdout", None),
            getattr(encoder, "stdin", None),
        ):
            try:
                if stream is not None and not stream.closed:
                    stream.close()
            except OSError:
                pass
        shutil.rmtree(temporary_dir, ignore_errors=True)'''
          if old_finally not in text:
              raise SystemExit('cleanup anchor missing')
          text = text.replace(old_finally, new_finally, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Install FFmpeg and project
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --editable .
      - name: Focused export gate
        run: |
          python -m compileall -q src/cinepulse/composer_export.py
          python -m unittest tests.test_composer_export tests.test_composer_resample tests.test_composer_runtime tests.test_composer_decode tests.test_composer_audio tests.test_composer_audio_binding tests.test_composer_media
      - name: Integrate successful patch
        if: ${{ success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cinepulse/composer_export.py
          git rm .github/workflows/_tmp-composer-export-fix.yml
          git commit -m "Preview composer: fix reference decode and diagnostics"
          git push origin HEAD:preview-restoration-lab
      - name: Remove failed writer
        if: ${{ failure() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin preview-restoration-lab || true
          git rm -f .github/workflows/_tmp-composer-export-fix.yml || true
          git commit -m "chore: remove failed composer export fix gate" || true
          git push origin HEAD:preview-restoration-lab || true
