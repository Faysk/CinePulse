name: Overlay Preview Integration Patch

on:
  push:
    branches: [preview-overlay-composer]
    paths:
      - '.github/workflows/overlay-studio-integrate.yml'
      - 'scripts/integrate_overlay_studio.py'
      - 'scripts/integrate_overlay_phase8_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-overlay-composer
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply Studio integration
        run: python scripts/integrate_overlay_studio.py
      - name: Apply Composer UI integration
        run: python scripts/integrate_overlay_phase8_ui.py
      - name: Compile patched Preview files
        run: python -m compileall -q src/cinepulse/studio.py src/cinepulse/ui/overlay_view.py src/cinepulse/overlay_presets.py
      - name: Verify integration markers
        run: >-
          python -c "from pathlib import Path;
          s=Path('src/cinepulse/studio.py').read_text(encoding='utf-8');
          u=Path('src/cinepulse/ui/overlay_view.py').read_text(encoding='utf-8');
          markers=('overlay_scene_json:','build_overlay_ffmpeg_plan(','visualizer_audio_index');
          ui_markers=('def _apply_layout_preset','scale_group(group_id','Layout rápido','LAYOUT_PRESETS');
          missing=[m for m in markers if m not in s]+[m for m in ui_markers if m not in u];
          assert not missing, f'missing integration markers: {missing}';
          print('CINEPULSE_OVERLAY_PREVIEW_PATCH_OK')"
      - name: Commit Preview integration
        shell: bash
        run: |
          if git diff --quiet -- src/cinepulse/studio.py src/cinepulse/ui/overlay_view.py; then
            echo 'Preview integration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cinepulse/studio.py src/cinepulse/ui/overlay_view.py
          git commit -m 'overlay phase 8: integrate layout presets and group scaling'
          git push origin HEAD:preview-overlay-composer
