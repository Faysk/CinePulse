name: Publish CinePulse 1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.0.0.yml'

permissions:
  contents: write

concurrency:
  group: publish-cinepulse-1.0.0
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish 1.0.0
    if: github.actor == 'Faysk' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CINEPULSE_VERSION: 1.0.0
      CINEPULSE_AUDITED_SHA: 4afd4f4bf658dabe127754dd7752d0636832e2c1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout audited release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CINEPULSE_AUDITED_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Confirm release identity
        shell: pwsh
        run: |
          $Actual = (git rev-parse HEAD).Trim()
          if ($Actual -ne $env:CINEPULSE_AUDITED_SHA) {
            throw "Checkout SHA divergiu do merge auditado: $Actual"
          }
          $VersionText = Get-Content -LiteralPath 'src/cinepulse/__init__.py' -Raw
          if ($VersionText -notmatch '__version__\s*=\s*"1\.0\.0"') {
            throw 'O commit auditado não declara CinePulse 1.0.0.'
          }
          $ExistingTag = git ls-remote --tags origin 'refs/tags/v1.0.0'
          if ($ExistingTag) { throw 'A tag v1.0.0 já existe; recusando publicação duplicada.' }
          gh --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI não está disponível no runner.' }
          Write-Host "CINEPULSE_RELEASE_IDENTITY_OK $Actual"

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .

      - name: Release light gate
        run: python scripts/ci_gate.py --profile release-light --output artifacts/ci/publish-release-windows.json

      - name: PowerShell release contract
        shell: pwsh
        run: ./scripts/Test-Release.ps1

      - name: Build portable
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Version $env:CINEPULSE_VERSION -BuildPython (Get-Command python).Source -SkipTests

      - name: Test portable updater/apply
        shell: pwsh
        run: ./scripts/Test-Updater.ps1 -Version $env:CINEPULSE_VERSION

      - name: Build MSI
        shell: pwsh
        run: ./scripts/Build-Msi.ps1 -Version $env:CINEPULSE_VERSION -BuildPython (Get-Command python).Source -SkipTests

      - name: Validate MSI payload
        shell: pwsh
        run: ./scripts/Test-Msi.ps1 -Version $env:CINEPULSE_VERSION

      - name: Install, repair and uninstall MSI
        shell: pwsh
        env:
          CINEPULSE_CI_ALLOW_MSI_LIFECYCLE: '1'
        run: ./scripts/Test-MsiLifecycle.ps1 -Version $env:CINEPULSE_VERSION

      - name: Generate release checksums and notes
        shell: pwsh
        run: |
          $Portable = "dist/CinePulse-$env:CINEPULSE_VERSION-windows-portable.zip"
          $Msi = "dist/CinePulse-$env:CINEPULSE_VERSION-Setup.msi"
          $MsiManifest = "dist/CinePulse-$env:CINEPULSE_VERSION-Setup-manifest.json"
          foreach ($Path in @($Portable, $Msi, $MsiManifest)) {
            if (-not (Test-Path -LiteralPath $Path)) { throw "Artefato ausente: $Path" }
          }
          $ChecksumLines = @()
          foreach ($Path in @($Portable, $Msi, $MsiManifest)) {
            $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToLowerInvariant()
            $ChecksumLines += "$Hash  $(Split-Path -Leaf $Path)"
          }
          $ChecksumLines | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

          $Notes = @'
          # CinePulse 1.0.0

          Primeira release Stable do CinePulse após o Core Integrity MegaPack e o Recovery & Reliability Mega Pack.

          ## Stable 1.0
          - pipeline target-aware para resolução/FPS/cor/entrega;
          - intermediários visuais lossless e promoção atômica;
          - recuperação/storage crash-safe com manifesto, checkpoints, lease e staging retomável;
          - correção da janela de crash após promoção do staging;
          - locks hashados para runtime principal e stack neural;
          - Portable e MSI validados em Windows, incluindo install/repair/uninstall;
          - updater remoto desativado por padrão; quando configurado exige canal assinado.

          ## Preview / não promovido
          - recuperação genérica pela interface permanece Preview/shadow por padrão;
          - 8K/120 neural e outros caminhos GPU/extremos não são declarados fisicamente aceitos Stable enquanto o gate NVIDIA dedicado não tiver PASS;
          - 10K/12K e 144/240/480 fps permanecem experimentais/bloqueados no perfil Stable.

          ## Integridade
          Esta publicação foi reconstruída e revalidada a partir do merge auditado `4afd4f4bf658dabe127754dd7752d0636832e2c1` antes da criação da tag.

          O MSI desta release não possui assinatura Authenticode porque nenhum certificado de produção foi configurado. Verifique `SHA256SUMS.txt` antes da instalação quando o arquivo vier de fora da página oficial da release.
          '@
          $Notes | Set-Content -LiteralPath 'artifacts/release-notes-1.0.0.md' -Encoding utf8

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinepulse-1.0.0-publication-evidence
          path: |
            artifacts/ci/*.json
            artifacts/release-notes-1.0.0.md
            dist/CinePulse-1.0.0-windows-portable.zip
            dist/CinePulse-1.0.0-Setup.msi
            dist/CinePulse-1.0.0-Setup-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Create v1.0.0 release
        id: publish_release
        shell: pwsh
        run: |
          gh release create v1.0.0 `
            "dist/CinePulse-1.0.0-windows-portable.zip" `
            "dist/CinePulse-1.0.0-Setup.msi" `
            "dist/CinePulse-1.0.0-Setup-manifest.json" `
            "dist/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:CINEPULSE_AUDITED_SHA `
            --title 'CinePulse 1.0.0' `
            --notes-file 'artifacts/release-notes-1.0.0.md' `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar GitHub Release v1.0.0.' }
          $Release = gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,url,targetCommitish | ConvertFrom-Json
          if ($Release.tagName -ne 'v1.0.0' -or $Release.isDraft -or $Release.isPrerelease) {
            throw 'Release criada com metadados inesperados.'
          }
          Write-Host "CINEPULSE_RELEASE_PUBLISHED $($Release.url)"

      - name: Remove temporary publisher from main
        if: success()
        continue-on-error: true
        shell: pwsh
        run: |
          $ApiPath = "repos/$env:GITHUB_REPOSITORY/contents/.github/workflows/publish-1.0.0.yml"
          $PublisherSha = (gh api "${ApiPath}?ref=main" --jq '.sha').Trim()
          if (-not $PublisherSha) { throw 'Não foi possível localizar o publisher temporário em main.' }
          gh api --method DELETE $ApiPath `
            -f message='chore: remove temporary 1.0.0 publisher' `
            -f sha=$PublisherSha `
            -f branch='main'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao remover publisher temporário.' }
          Write-Host 'CINEPULSE_TEMP_PUBLISHER_REMOVED'
