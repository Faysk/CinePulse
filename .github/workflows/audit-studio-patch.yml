name: Audit Studio Patch

on:
  push:
    branches: [audit-1.1.2-complete-hardening]
    paths:
      - 'scripts/_audit_patch_studio.py'
      - '.github/workflows/audit-studio-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit-1.1.2-complete-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Apply exact patch
        run: python scripts/_audit_patch_studio.py
      - name: Compile patched Studio
        run: python -m py_compile src/cinepulse/studio.py
      - name: Verify self-contained wording
        shell: pwsh
        run: |
          $text = Get-Content src/cinepulse/studio.py -Raw
          if ($text -match '%LOCALAPPDATA%\\CinePulse') { throw 'Stale LocalAppData claim remains.' }
          if ($text -notmatch 'pasta CinePulse escolhida na instalação') { throw 'Installer v2 wording missing.' }
      - name: Commit Studio patch
        shell: bash
        run: |
          if git diff --quiet -- src/cinepulse/studio.py; then
            echo 'Studio already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cinepulse/studio.py
          git commit -m 'audit: align installed-update guidance with self-contained layout'
          git push origin HEAD:audit-1.1.2-complete-hardening
