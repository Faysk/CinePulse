name: Temporary H1 Runtime Integrator 2

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h1-runtime2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Apply H1 runtime scheduling
        shell: python
        run: |
          from pathlib import Path

          scheduler = Path('src/cinepulse/resource_scheduler.py')
          text = scheduler.read_text(encoding='utf-8')
          if '    max_threads: int | None = None,\n) -> CpuSchedule:' not in text:
              text = text.replace(
                  '    thermal_constrained: bool = False,\n) -> CpuSchedule:',
                  '    thermal_constrained: bool = False,\n    max_threads: int | None = None,\n) -> CpuSchedule:', 1)
          if 'requested_cap = max(1, min(logical, int(max_threads)))' not in text:
              text = text.replace(
                  '    available = max(1, logical - reserve)\n\n',
                  '    available = max(1, logical - reserve)\n    if max_threads is not None:\n        try:\n            requested_cap = max(1, min(logical, int(max_threads)))\n        except (TypeError, ValueError):\n            requested_cap = logical\n        available = min(available, requested_cap)\n\n', 1)
          if '    max_threads: int | None = None,\n) -> tuple[int, ...]:' not in text:
              text = text.replace(
                  '    gpu_active: bool = False,\n) -> tuple[int, ...]:',
                  '    gpu_active: bool = False,\n    max_threads: int | None = None,\n) -> tuple[int, ...]:', 1)
          text = text.replace(
              '    schedule = schedule_cpu_threads(stage, topology=topology, mode=mode, gpu_active=gpu_active)\n',
              '    schedule = schedule_cpu_threads(stage, topology=topology, mode=mode, gpu_active=gpu_active, max_threads=max_threads)\n', 1)
          text = text.replace(
              '    return tuple(sorted(value for value in candidates if value <= topology.logical_cpus))\n',
              '    ceiling = topology.logical_cpus if max_threads is None else max(1, min(topology.logical_cpus, int(max_threads)))\n    return tuple(sorted(value for value in candidates if value <= ceiling))\n', 1)
          scheduler.write_text(text, encoding='utf-8')

          studio = Path('src/cinepulse/studio.py')
          text = studio.read_text(encoding='utf-8')
          perf_import = 'from .performance_policy import clamp_cpu_threads, default_cpu_threads, realesrgan_pipeline_threads\n'
          sched_import = 'from .resource_scheduler import detect_cpu_topology, schedule_cpu_threads\n'
          if sched_import not in text:
              text = text.replace(perf_import, perf_import + sched_import, 1)
          worker_anchor = '            working_video = settings.video\n            working_w, working_h = source_w, source_h\n'
          if 'def stage_threads(stage: str' not in text:
              insert = '''            cpu_topology = detect_cpu_topology()\n            dedicated_threshold = max(1, cpu_topology.logical_cpus - (2 if cpu_topology.logical_cpus >= 8 else 1))\n            machine_mode = "dedicated" if settings.cpu_threads >= dedicated_threshold else "balanced"\n\n            def stage_threads(stage: str, *, gpu_active: bool = False) -> int:\n                plan = schedule_cpu_threads(\n                    stage, topology=cpu_topology, mode=machine_mode, gpu_active=gpu_active,\n                    max_threads=settings.cpu_threads,\n                )\n                self._log(\n                    f"H1 CPU {stage}: {plan.threads}/{plan.logical_cpus} threads "\n                    f"(cap {settings.cpu_threads}, {machine_mode}; {plan.reason})"\n                )\n                return plan.threads\n\n            working_video = settings.video\n            working_w, working_h = source_w, source_h\n'''
              if worker_anchor not in text:
                  raise SystemExit('worker anchor missing')
              text = text.replace(worker_anchor, insert, 1)
          pairs = [
              ('                    settings.cpu_threads,\n                    progress_base,\n                    5.0,\n', '                    stage_threads("color"),\n                    progress_base,\n                    5.0,\n'),
              ('                    temp_paths, temp_dirs, settings.cpu_threads, progress_base, 20,\n', '                    temp_paths, temp_dirs, stage_threads("neural_gpu", gpu_active=True), progress_base, 20,\n'),
              ('                        settings.use_cpu, settings.cpu_threads, temp_paths, progress_base, base_rife_weight,\n', '                        settings.use_cpu, stage_threads("neural_gpu", gpu_active=True), temp_paths, progress_base, base_rife_weight,\n'),
              ('                    "-threads", str(settings.cpu_threads), "-progress", "pipe:1", "-nostats", str(master)\n', '                    "-threads", str(stage_threads("scale", gpu_active=not settings.use_cpu)), "-progress", "pipe:1", "-nostats", str(master)\n'),
              ('                        settings.cpu_threads, color_plan,\n', '                        stage_threads("vfx_cpu"), color_plan,\n'),
              ('                                audio_source, settings.audio_focus, settings.use_cpu, settings.cpu_threads,\n', '                                audio_source, settings.audio_focus, settings.use_cpu, stage_threads("audio"),\n'),
              ('                            "180M", "360M", settings.use_cpu, settings.cpu_threads,\n', '                            "180M", "360M", settings.use_cpu, stage_threads("vfx_cpu"),\n'),
              ('                        settings.use_cpu, settings.cpu_threads, temp_paths, progress_base, rife_weight,\n', '                        settings.use_cpu, stage_threads("neural_gpu", gpu_active=True), temp_paths, progress_base, rife_weight,\n'),
              ('                command += ["-threads", str(settings.cpu_threads), "-t", f"{project_duration:.6f}"]\n', '                command += ["-threads", str(stage_threads("encode", gpu_active=not settings.use_cpu and self._nvenc)), "-t", f"{project_duration:.6f}"]\n'),
              ('                    output_path, settings, project_duration, loop_start, settings.cpu_threads,\n', '                    output_path, settings, project_duration, loop_start, stage_threads("encode", gpu_active=not settings.use_cpu and self._nvenc),\n'),
          ]
          for old, new in pairs:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit('stage anchor missing: ' + old[:70])
          studio.write_text(text, encoding='utf-8')

          tests = Path('tests/test_resource_scheduler.py')
          text = tests.read_text(encoding='utf-8')
          if 'test_user_cap_is_never_exceeded' not in text:
              marker = '    def test_benchmark_choice_requires_integrity(self) -> None:\n'
              extra = '''    def test_user_cap_is_never_exceeded(self) -> None:\n        plan = schedule_cpu_threads("encode", topology=self.topology, mode="dedicated", max_threads=7)\n        self.assertEqual(plan.threads, 7)\n\n    def test_gpu_stage_respects_smaller_manual_cap(self) -> None:\n        plan = schedule_cpu_threads("neural_gpu", topology=self.topology, mode="dedicated", gpu_active=True, max_threads=3)\n        self.assertEqual(plan.threads, 3)\n\n    def test_candidate_set_respects_user_cap(self) -> None:\n        values = candidate_thread_counts("encode", topology=self.topology, mode="dedicated", max_threads=9)\n        self.assertTrue(values)\n        self.assertTrue(all(value <= 9 for value in values))\n\n'''
              text = text.replace(marker, extra + marker, 1)
          tests.write_text(text, encoding='utf-8')

          docs = Path('docs/HARDWARE_UTILIZATION_PHASE2.md')
          text = docs.read_text(encoding='utf-8')
          if '## Runtime stage-aware integration' not in text:
              text = text.rstrip() + '''\n\n## Runtime stage-aware integration\n\nThe render worker now derives a bounded CPU budget per stage from detected topology while treating the saved/user thread value as a hard ceiling. CPU-heavy stages can use the profile envelope; GPU neural stages deliberately keep host concurrency modest to protect laptop package power and driver feed. Concurrency changes only: image algorithms, model selection, color/HDR transforms, cadence, audio, verification and recovery contracts are unchanged. Physical throughput and thermal acceptance still require real hardware telemetry.\n'''
          docs.write_text(text, encoding='utf-8')
      - name: Focused H1 tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_resource_scheduler tests.test_performance_policy
      - name: Commit source integration
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/cinepulse/resource_scheduler.py src/cinepulse/studio.py tests/test_resource_scheduler.py docs/HARDWARE_UTILIZATION_PHASE2.md
          git commit -m "Hardware H1: wire stage-aware CPU runtime scheduling"
          git push origin HEAD:preview-restoration-lab
