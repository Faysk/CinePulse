name: Temporary Hardware H4 Integration Polish

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h4-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Polish H4 Studio integration
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/cinepulse/studio.py')
          text = path.read_text(encoding='utf-8')

          old_ai = '''                    cache_source_video=settings.video, cache_quota_gb=settings.cache_quota_gb,
                                      chunk_budget_gb=realesrgan_budget.chunk_budget_gb,
                      overlap_extract=realesrgan_budget.overlap_extract,
  )'''
          new_ai = '''                    cache_source_video=settings.video,
                      cache_quota_gb=settings.cache_quota_gb,
                      chunk_budget_gb=realesrgan_budget.chunk_budget_gb,
                      overlap_extract=realesrgan_budget.overlap_extract,
                  )'''
          if old_ai not in text:
              raise SystemExit('Real-ESRGAN call formatting anchor not found')
          text = text.replace(old_ai, new_ai, 1)

          old_rife = '''                        color_plan=color_plan,
                                              chunk_budget_gb=rife_budget.chunk_budget_gb,
                          overlap_extract=(rife_budget.overlap_extract and not settings.use_cpu),
  )'''
          new_rife = '''                        color_plan=color_plan,
                          chunk_budget_gb=rife_budget.chunk_budget_gb,
                          overlap_extract=(rife_budget.overlap_extract and not settings.use_cpu),
                      )'''
          count = text.count(old_rife)
          if count != 2:
              raise SystemExit(f'expected 2 RIFE formatting anchors, got {count}')
          text = text.replace(old_rife, new_rife)

          strict = '''                frames = len(list(incoming.glob("frame*.png")))
                  if frames != count:
                      raise RuntimeError(f"A IA recebeu {frames} de {count} quadros esperados no lote.")
  '''
          tolerant = '''                frames = len(list(incoming.glob("frame*.png")))
                  if frames < 1:
                      raise RuntimeError("A IA não recebeu nenhum quadro do vídeo.")
                  if frames != count:
                      self._log(
                          f"H4 PREFETCH Real-ESRGAN: FFmpeg entregou {frames}/{count} quadros; "
                          "desativando prefetch para os lotes restantes e preservando a tolerância histórica."
                      )
                      overlap_extract = False
  '''
          if strict not in text:
              raise SystemExit('Real-ESRGAN frame-count compatibility anchor not found')
          text = text.replace(strict, tolerant, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Python 3.11 and focused H4 gate
        run: |
          python -m pip install --disable-pip-version-check --editable .
          python -m py_compile src/cinepulse/studio.py
          python -m unittest discover -s tests -p 'test_pipeline_runtime.py'
          python -m unittest discover -s tests -p 'test_pipeline_budget.py'
          python -m unittest discover -s tests -p 'test_realesrgan_tuning.py'
          python -m unittest discover -s tests -p 'test_rife_tuning.py'
      - name: Commit polish and remove temporary writer
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp-h4-polish.yml
          git add src/cinepulse/studio.py
          git commit -m "Hardware H4: polish bounded prefetch integration"
          git push origin HEAD:preview-restoration-lab
