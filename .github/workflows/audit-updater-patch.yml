name: Audit Bootstrap Hardening

on:
  push:
    branches: [audit-final-hardening]
    paths:
      - 'scripts/_audit_bootstrap_patch_v2.py'
      - '.github/workflows/audit-updater-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit-final-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Apply bootstrap hardening
        run: python scripts/_audit_bootstrap_patch_v2.py
      - name: Parse PowerShell
        shell: pwsh
        run: |
          foreach ($Path in @('installer/Start-CinePulse.ps1','installer/Apply-CinePulseUpdate.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $Path), [ref]$null, [ref]$errors)
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; throw "PowerShell parse failed: $Path" }
          }
      - name: Verify hardening markers
        shell: pwsh
        run: |
          $text = Get-Content installer/Start-CinePulse.ps1 -Raw
          foreach ($Needle in @(
            'Apply-CinePulseUpdate.ps1',
            'uv-version.txt',
            "Install-VerifiedArchive -Key 'ffmpeg'",
            '$StateHash',
            'CINEPULSE_CI_COMPONENT_FAIL_AFTER_PROMOTE',
            '$ExpectedPythonVersion',
            '$RebuildRuntime',
            '$State.soundfile',
            '$State.cuda_runtime'
          )) {
            if (-not $text.Contains($Needle)) { throw "Bootstrap hardening marker missing: $Needle" }
          }
          if ($text -match 'if \(\(Test-Path -LiteralPath \$FfmpegExe\).*return') {
            throw 'Legacy FFmpeg existence-only fast path remains.'
          }
      - name: Commit hardening
        shell: bash
        run: |
          if git diff --quiet -- installer/Start-CinePulse.ps1; then
            echo 'Bootstrap already hardened.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer/Start-CinePulse.ps1
          git commit -m 'fix: harden runtime and component upgrades'
          git pull --rebase origin audit-final-hardening
          git push origin HEAD:audit-final-hardening
