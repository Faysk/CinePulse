name: Temporary H5 CUDA Studio Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h5-cuda-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Apply evidence-gated CUDA decode integration
        run: python scripts/_tmp_h5_studio_integrate.py
      - name: Validate focused H5 contracts
        run: |
          python -m py_compile src/cinepulse/gpu_media.py src/cinepulse/studio.py scripts/gpu_media_benchmark.py
          python -m unittest tests.test_gpu_media tests.test_gpu_media_target_geometry tests.test_pipeline_runtime tests.test_h4_overlap_contract
      - name: Remove temporary integrator artifacts
        run: git rm scripts/_tmp_h5_studio_integrate.py .github/workflows/_tmp-h5-cuda-integrate.yml
      - name: Commit integrated H5 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cinepulse/studio.py
          git commit -m "Hardware H5: integrate evidence-gated NVDEC extraction"
          git push origin HEAD:preview-restoration-lab
