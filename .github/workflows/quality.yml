name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Release gate
        shell: powershell
        run: .\scripts\Test-Release.ps1
