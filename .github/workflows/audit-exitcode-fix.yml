name: Audit Updater ExitCode Fix

on:
  push:
    branches: [audit-final-hardening]
    paths:
      - 'scripts/_audit_fix_powershell_exitcode.py'
      - '.github/workflows/audit-exitcode-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit-final-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Apply updater wrapper fix
        run: python scripts/_audit_fix_powershell_exitcode.py
      - name: Parse and verify
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'installer/Start-CinePulse.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; throw 'PowerShell parse failed.' }
          $text = Get-Content installer/Start-CinePulse.ps1 -Raw
          if (-not $text.Contains('Aplicador transacional de atualização falhou.')) { throw 'Wrapped updater exception missing.' }
          if ($text.Contains('Aplicador transacional de atualização falhou com código $LASTEXITCODE.')) { throw 'Stale LASTEXITCODE wrapper remains.' }
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer/Start-CinePulse.ps1
          git commit -m 'fix: propagate PowerShell updater exceptions correctly'
          git pull --rebase origin audit-final-hardening
          git push origin HEAD:audit-final-hardening
