name: Neural Lock

on:
  workflow_dispatch:
  push:
    branches: [recovery-reliability-megapack]
    paths:
      - 'requirements-neural.in'
      - '.github/workflows/neural-lock.yml'

permissions:
  contents: write

concurrency:
  group: neural-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-neural-lock:
    name: Generate Windows neural hash lock
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery-reliability-megapack
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install locked resolver
        run: python -m pip install --disable-pip-version-check uv==0.12.1
      - name: Compile neural lock with hashes
        shell: pwsh
        run: |
          uv pip compile requirements-neural.in --generate-hashes --python-version 3.13 --output-file requirements-neural.lock
          if (-not (Select-String -LiteralPath requirements-neural.lock -Pattern '--hash=sha256:' -Quiet)) {
            throw 'Neural lock was generated without hashes.'
          }
      - name: Commit generated lock
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements-neural.lock
          if (git diff --cached --quiet) {
            Write-Host 'Neural lock already up to date.'
            exit 0
          }
          git commit -m 'build: refresh neural dependency lock [skip neural-lock]'
          git push origin HEAD:recovery-reliability-megapack
