name: Temporary Updater Full Audit

on:
  push:
    branches:
      - feature/one-click-updater

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/one-click-updater
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Apply updater audit fixes
        shell: pwsh
        run: |
          python scripts/_tmp_updater_full_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove temporary writer before validation
        shell: pwsh
        run: |
          git rm .github/workflows/_tmp-updater-full-audit.yml scripts/_tmp_updater_full_audit.py
      - name: Focused updater and distribution validation
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -m compileall -q src/cinepulse/studio.py src/cinepulse/update_manager.py scripts/release_gate.py scripts/final_audit.py tests/test_update_manager.py tests/test_update_ux.py tests/test_update_release_contract.py tests/test_distribution_phase8.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_update_manager tests.test_update_ux tests.test_update_release_contract tests.test_update_bootstrap_contract tests.test_distribution_phase8 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/final_audit.py --output artifacts/ci/updater-final-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit audited updater state
        shell: pwsh
        run: |
          git config user.name "Faysk"
          git config user.email "faysk.nan@gmail.com"
          git add src/cinepulse/studio.py src/cinepulse/update_manager.py tests/test_distribution_phase8.py tests/test_update_manager.py tests/test_update_ux.py tests/test_update_release_contract.py docs/PRIVACY.md docs/ONE_CLICK_UPDATER_ACCEPTANCE.md docs/ONE_CLICK_UPDATER_SECURITY.md scripts/release_gate.py scripts/final_audit.py
          git add -u .github/workflows scripts
          git commit -m "Updater: harden full integration audit"
          git push origin HEAD:feature/one-click-updater
