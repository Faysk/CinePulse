name: Temporary Preview Composer UI Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-composer-ui.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch Visual Lab entrypoint
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/cinepulse/ui/visual_view.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from .preview import effect_thumbnail, to_ppm_bytes\n'
          if 'from .composer_view import show_overlay_composer\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('visual_view import anchor not found')
              text = text.replace(import_anchor, import_anchor + 'from .composer_view import show_overlay_composer\n', 1)
          button_anchor = '    ttk.Button(source_row, text="Gerar preview real", command=lambda: studio._start(True)).pack(side="right")\n'
          replacement = (
              '    ttk.Button(source_row, text="Gerar preview real", command=lambda: studio._start(True)).pack(side="right")\n'
              '    ttk.Button(source_row, text="Overlay Composer…", command=lambda: show_overlay_composer(studio)).pack(side="right", padx=(0, 6))\n'
          )
          if 'text="Overlay Composer…"' not in text:
              if button_anchor not in text:
                  raise SystemExit('visual_view preview action anchor not found')
              text = text.replace(button_anchor, replacement, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Validate focused Preview composer contracts
        run: |
          python -m pip install --disable-pip-version-check --editable .
          python -m compileall -q src/cinepulse/overlay_composer.py src/cinepulse/visualizer_geometry.py src/cinepulse/visualizer_renderer.py src/cinepulse/ui/composer_view.py src/cinepulse/ui/visual_view.py
          python -m unittest tests.test_overlay_composer tests.test_visualizer_geometry tests.test_visualizer_renderer tests.test_gpu_compositor
      - name: Commit integration and remove temporary writer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cinepulse/ui/visual_view.py
          git rm .github/workflows/_tmp-composer-ui.yml
          git commit -m "Preview composer: expose isolated editor in Visual Lab"
          git push origin HEAD:preview-restoration-lab
