name: Temporary MSI Updater Hardening

on:
  push:
    branches:
      - feature/one-click-updater

permissions:
  contents: write

jobs:
  harden:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/one-click-updater
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Patch and test MSI updater handoff
        shell: pwsh
        run: |
          python scripts/_tmp_patch_msi_update.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q src/cinepulse/update_manager.py src/cinepulse/studio.py tests/test_update_manager.py tests/test_update_ux.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = 'src'
          python -m unittest tests.test_update_manager tests.test_update_ux -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit hardening and clean temporary helpers
        shell: pwsh
        run: |
          git config user.name "Faysk"
          git config user.email "faysk.nan@gmail.com"
          git rm .github/workflows/_tmp-msi-updater-hardening.yml scripts/_tmp_patch_msi_update.py
          git add src/cinepulse/update_manager.py
          git commit -m "Updater: suppress bootstrap during MSI major upgrade"
          git push origin HEAD:feature/one-click-updater
