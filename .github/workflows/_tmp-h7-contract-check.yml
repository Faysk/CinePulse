name: Temporary H7 Contract Check
on:
  push:
    branches: [preview-restoration-lab]
    paths: [.github/workflows/_tmp-h7-contract-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: H7 focused gates
        run: |
          python -m pip install --disable-pip-version-check --editable .
          python -m compileall -q src/cinepulse scripts/tensorrt_preview_benchmark.py
          python -m unittest tests.test_tensorrt_preview tests.test_ncnn_baseline tests.test_rife_tuning tests.test_realesrgan_tuning
          python scripts/tensorrt_preview_benchmark.py --help > /dev/null
      - name: Clean temporary writer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/_tmp-h7-contract-check.yml
          git commit -m "chore: remove temporary H7 contract check"
          git pull --rebase origin preview-restoration-lab
          git push origin preview-restoration-lab
