name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer da release (ex. 1.0.0-rc.6)
        required: true
        default: 1.0.0-rc.6
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release-gate:
    name: Windows release gate
    runs-on: windows-latest
    env:
      CINEPULSE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Normalize version from tag
        shell: pwsh
        run: |
          if ($env:CINEPULSE_VERSION.StartsWith('v')) { $env:CINEPULSE_VERSION = $env:CINEPULSE_VERSION.Substring(1) }
          "CINEPULSE_VERSION=$env:CINEPULSE_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Release light gate
        run: python scripts/ci_gate.py --profile release-light --output artifacts/ci/release-windows.json
      - name: PowerShell release contract
        shell: pwsh
        run: ./scripts/Test-Release.ps1
      - name: Build portable
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Version $env:CINEPULSE_VERSION -BuildPython (Get-Command python).Source -SkipTests
      - name: Test portable updater/apply
        shell: pwsh
        run: ./scripts/Test-Updater.ps1 -Version $env:CINEPULSE_VERSION
      - name: Build MSI
        shell: pwsh
        run: ./scripts/Build-Msi.ps1 -Version $env:CINEPULSE_VERSION -BuildPython (Get-Command python).Source -SkipTests
      - name: Validate MSI payload
        shell: pwsh
        run: ./scripts/Test-Msi.ps1 -Version $env:CINEPULSE_VERSION
      - name: Install, repair and uninstall MSI
        shell: pwsh
        env:
          CINEPULSE_CI_ALLOW_MSI_LIFECYCLE: '1'
        run: ./scripts/Test-MsiLifecycle.ps1 -Version $env:CINEPULSE_VERSION
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinepulse-release-candidate-${{ env.CINEPULSE_VERSION }}
          path: |
            artifacts/ci/*.json
            dist/CinePulse-*.zip
            dist/CinePulse-*.msi
            dist/*manifest*.json
            dist/*.minisig
          if-no-files-found: warn
          retention-days: 14
