name: Overlay Studio Integration Patch

on:
  push:
    branches: [preview-overlay-composer]
    paths:
      - '.github/workflows/overlay-studio-integrate.yml'
      - 'scripts/integrate_overlay_studio.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-overlay-composer
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply deterministic Studio patch
        run: python scripts/integrate_overlay_studio.py
      - name: Compile patched Studio
        run: python -m compileall -q src/cinepulse/studio.py
      - name: Verify integration markers
        run: >-
          python -c "from pathlib import Path; t=Path('src/cinepulse/studio.py').read_text(encoding='utf-8');
          markers=('overlay_scene_json: str = \\"\\"','build_overlay_ffmpeg_plan(','visualizer_audio_index','Overlay Composer: cena persistida inválida','overlay_composer_view.set_scene(scene)');
          missing=[m for m in markers if m not in t];
          assert not missing, f'missing integration markers: {missing}';
          print('CINEPULSE_OVERLAY_STUDIO_PATCH_OK')"
      - name: Commit Studio integration
        shell: bash
        run: |
          if git diff --quiet -- src/cinepulse/studio.py; then
            echo 'Studio already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cinepulse/studio.py
          git commit -m 'overlay phase 7: persist and render Preview composition'
          git push origin HEAD:preview-overlay-composer
