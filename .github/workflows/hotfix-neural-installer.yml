name: Hotfix Neural Installer

on:
  push:
    branches: [hotfix-1.0.1-neural-installer]
    paths:
      - 'scripts/_hotfix_apply_neural_index.py'
      - '.github/workflows/hotfix-neural-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'Faysk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix-1.0.1-neural-installer
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply neural index patch
        run: python scripts/_hotfix_apply_neural_index.py
      - name: Verify PowerShell contract
        shell: pwsh
        run: |
          $text = Get-Content installer/Start-CinePulse.ps1 -Raw
          if ($text -notmatch 'BootstrapManifest\.demucs\.torch_index') { throw 'torch_index not wired' }
          if ($text -notmatch '--index \$TorchIndex') { throw 'uv index flag not wired' }
      - name: Commit patched installer
        shell: bash
        run: |
          if git diff --quiet -- installer/Start-CinePulse.ps1; then
            echo 'Installer already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer/Start-CinePulse.ps1
          git commit -m 'fix: resolve neural lock from official PyTorch CUDA index'
          git push origin HEAD:hotfix-1.0.1-neural-installer
