name: Installer v2 Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'CinePulse*.cmd'
      - 'Install-CinePulse*.cmd'
      - 'installer/**'
      - 'pyproject.toml'
      - 'src/cinepulse/__init__.py'
      - 'src/cinepulse/paths.py'
      - 'requirements*.lock'
      - 'requirements-neural.in'
      - 'scripts/Build-Msi.ps1'
      - 'scripts/Build-Portable.ps1'
      - 'scripts/Invoke-RcAcceptance.ps1'
      - 'scripts/Test-Msi*.ps1'
      - 'scripts/Test-Updater.ps1'
      - 'scripts/Test-IsolatedEnvironment.ps1'
      - 'scripts/Test-NeuralInstaller.ps1'
      - 'scripts/final_audit.py'
      - 'tests/test_installer_v2_contract.py'
      - '.github/workflows/installer-v2-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'CinePulse*.cmd'
      - 'Install-CinePulse*.cmd'
      - 'installer/**'
      - 'pyproject.toml'
      - 'src/cinepulse/__init__.py'
      - 'src/cinepulse/paths.py'
      - 'requirements*.lock'
      - 'requirements-neural.in'
      - 'scripts/Build-Msi.ps1'
      - 'scripts/Build-Portable.ps1'
      - 'scripts/Invoke-RcAcceptance.ps1'
      - 'scripts/Test-Msi*.ps1'
      - 'scripts/Test-Updater.ps1'
      - 'scripts/Test-IsolatedEnvironment.ps1'
      - 'scripts/Test-NeuralInstaller.ps1'
      - 'scripts/final_audit.py'
      - 'tests/test_installer_v2_contract.py'
      - '.github/workflows/installer-v2-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-v2-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-self-contained:
    name: Windows self-contained installer
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Resolve repository version
        shell: pwsh
        run: |
          $ProjectVersion = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $ProjectVersion) { throw 'Unable to read pyproject version.' }
          $Text = Get-Content -LiteralPath 'src/cinepulse/__init__.py' -Raw
          $Match = [regex]::Match($Text, '__version__\s*=\s*"([^"]+)"')
          if (-not $Match.Success) { throw 'Unable to resolve package version.' }
          $PackageVersion = $Match.Groups[1].Value
          if ($ProjectVersion -ne $PackageVersion) { throw "Version mismatch: pyproject=$ProjectVersion package=$PackageVersion" }
          "CINEPULSE_VERSION=$ProjectVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "CINEPULSE_INSTALLER_ACCEPTANCE_VERSION=$ProjectVersion"
      - name: Install locked CinePulse runtime and test tooling
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest install failed' }
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'hash-locked core runtime install failed' }
          python -m pip install --disable-pip-version-check --no-deps --editable .
          if ($LASTEXITCODE -ne 0) { throw 'CinePulse editable install failed' }
          python -c "import cinepulse, numpy, os, sys; assert cinepulse.__version__ == os.environ['CINEPULSE_VERSION']; print('CINEPULSE_ACCEPTANCE_RUNTIME', cinepulse.__version__, sys.version.split()[0], numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'locked runtime/version import proof failed' }
      - name: Installer v2 contract tests
        run: python -m pytest -q tests/test_installer_v2_contract.py
      - name: Final static release audit
        run: python scripts/final_audit.py --output artifacts/ci/installer-v2-final-audit.json
      - name: Prove process temp and caches stay under CinePulse root
        shell: pwsh
        run: ./scripts/Test-IsolatedEnvironment.ps1 -Python (Get-Command python).Source
      - name: Prove hash-locked neural stack resolves on Python 3.14
        shell: pwsh
        run: ./scripts/Test-NeuralInstaller.ps1 -Python (Get-Command python).Source
      - name: Build MSI with selectable install directory
        shell: pwsh
        run: ./scripts/Build-Msi.ps1 -Version $env:CINEPULSE_VERSION -BuildPython (Get-Command python).Source -SkipTests
      - name: Validate MSI payload and UI contract
        shell: pwsh
        run: ./scripts/Test-Msi.ps1 -Version $env:CINEPULSE_VERSION
      - name: Install repair uninstall in custom folder
        shell: pwsh
        env:
          CINEPULSE_CI_ALLOW_MSI_LIFECYCLE: '1'
        run: ./scripts/Test-MsiLifecycle.ps1 -Version $env:CINEPULSE_VERSION
      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinepulse-installer-v2-acceptance
          path: |
            artifacts/ci/**
            dist/CinePulse-*-Setup.msi
            dist/CinePulse-*-Setup-manifest.json
            dist/CinePulse-*-windows-portable.zip
          if-no-files-found: warn
          retention-days: 14
