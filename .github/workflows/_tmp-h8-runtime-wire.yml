name: Temporary H8 Overnight Runtime Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h8-runtime-wire.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install project for focused contract tests
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Wire overnight profile into live render runtime
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/cinepulse/studio.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              if old not in value:
                  raise SystemExit(f'H8 expected {label} not found')
              return value.replace(old, new, 1)

          text = replace_once(
              text,
              'from .performance_policy import clamp_cpu_threads, default_cpu_threads, realesrgan_pipeline_threads\n',
              'from .performance_policy import (\n    PROFILE_OVERNIGHT, clamp_cpu_threads, default_cpu_threads, profile_for_threads, realesrgan_pipeline_threads,\n)\n',
              'performance_policy import',
          )

          mode_line = '            machine_mode = "dedicated" if settings.cpu_threads >= dedicated_threshold else "balanced"\n'
          text = replace_once(
              text,
              mode_line,
              mode_line
              + '            machine_profile = profile_for_threads(settings.cpu_threads, cpu_topology.logical_cpus)\n'
              + '            overnight_mode = machine_profile == PROFILE_OVERNIGHT\n'
              + '            if overnight_mode:\n'
              + '                self._log("H8 Overnight: controlador sustentado ativo; somente downshift de recursos é permitido.")\n',
              'machine-mode line',
          )

          text = replace_once(
              text,
              '                allow_pack_overlap=realesrgan_budget.overlap_pack,\n            )',
              '                allow_pack_overlap=realesrgan_budget.overlap_pack,\n'
              '                overnight=overnight_mode,\n'
              '                scratch_sustainable_mbps=neural_headroom.scratch_write_mbps,\n'
              '            )',
              'Real-ESRGAN adaptive controller',
          )
          text = replace_once(
              text,
              '                allow_pack_overlap=False,\n            )',
              '                allow_pack_overlap=False,\n'
              '                overnight=overnight_mode,\n'
              '                scratch_sustainable_mbps=neural_headroom.scratch_write_mbps,\n'
              '            )',
              'RIFE adaptive controller',
          )

          text = replace_once(
              text,
              '                            f"chunk={decision.chunk_scale:.2f}x, extract_overlap={decision.allow_extract_overlap}, "\n'
              '                            f"pack_overlap={decision.allow_pack_overlap}. Qualidade/modelo/FPS permanecem inalterados."\n',
              '                            f"chunk={decision.chunk_scale:.2f}x, cpu={decision.cpu_scale:.2f}x, "\n'
              '                            f"extract_overlap={decision.allow_extract_overlap}, pack_overlap={decision.allow_pack_overlap}, "\n'
              '                            f"cooldown_hint={decision.cooldown_hint_seconds:.0f}s. Qualidade/modelo/FPS permanecem inalterados."\n',
              'downshift log',
          )

          method_start = text.index('    def _enhance_clip_ai(')
          method_end = text.index('    def _interpolate_rife(', method_start)
          before, method, after = text[:method_start], text[method_start:method_end], text[method_end:]
          method = replace_once(
              method,
              '                    active_chunk_frames = decision.limit_chunk_frames(chunk_frames)\n'
              '                else:\n'
              '                    active_chunk_frames = chunk_frames\n',
              '                    active_chunk_frames = decision.limit_chunk_frames(chunk_frames)\n'
              '                    active_cpu_threads = decision.limit_cpu_threads(cpu_threads)\n'
              '                else:\n'
              '                    active_chunk_frames = chunk_frames\n'
              '                    active_cpu_threads = cpu_threads\n',
              'Real-ESRGAN runtime decision',
          )
          method = replace_once(
              method,
              '                    "-pix_fmt", "yuv420p", "-threads", str(cpu_threads),\n',
              '                    "-pix_fmt", "yuv420p", "-threads", str(active_cpu_threads),\n',
              'Real-ESRGAN pack threads',
          )
          text = before + method + after
          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Focused H8 contract tests
        run: |
          python -m compileall -q src tests
          python -m unittest -v tests.test_adaptive_runtime tests.test_overnight_runtime tests.test_h8_adaptive_integration tests.test_h4_overlap_contract tests.test_h5_runtime_integration tests.test_overlay_composer tests.test_gpu_compositor tests.test_tensorrt_preview
      - name: Assert live H8 wiring
        shell: python
        run: |
          from pathlib import Path
          text = Path('src/cinepulse/studio.py').read_text(encoding='utf-8')
          required = (
              'machine_profile = profile_for_threads',
              'overnight=overnight_mode',
              'scratch_sustainable_mbps=neural_headroom.scratch_write_mbps',
              'active_cpu_threads = decision.limit_cpu_threads(cpu_threads)',
              'str(active_cpu_threads)',
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'H8 live wiring missing: {missing}')
      - name: Commit integrated runtime and remove temporary writer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-h8-runtime-wire.yml
          git add src/cinepulse/studio.py
          git commit -m "Hardware H8: wire sustained overnight controller into render runtime"
          git push origin preview-restoration-lab
