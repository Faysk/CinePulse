name: GPU Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gpu-acceptance.yml'
      - 'installer/**'
      - 'requirements*.lock'
      - 'requirements-neural.in'
      - 'scripts/realesrgan_autotune.py'
      - 'scripts/rife_benchmark.py'
      - 'scripts/gpu_*benchmark.py'
      - 'src/cinepulse/rife_engine.py'
      - 'src/cinepulse/rife_safe_runner.py'
      - 'src/cinepulse/component_identity.py'
      - 'src/cinepulse/performance_policy.py'
      - 'src/cinepulse/pipeline_budget.py'
      - 'src/cinepulse/pipeline_runtime.py'
      - 'src/cinepulse/adaptive_runtime.py'
      - 'src/cinepulse/hardware_telemetry.py'
      - 'src/cinepulse/realesrgan_tuning.py'
      - 'src/cinepulse/realesrgan_benchmark.py'
      - 'src/cinepulse/rife_tuning.py'
      - 'src/cinepulse/rife_benchmark.py'
      - 'src/cinepulse/studio.py'
      - 'src/cinepulse/job_lease.py'
      - 'src/cinepulse/render_worker.py'
      - 'src/cinepulse/stage_adapter.py'
      - 'src/cinepulse/frame_quality.py'
      - 'src/cinepulse/storage_resilience.py'
      - 'src/cinepulse/stem_engine.py'
      - 'src/cinepulse/composer_*.py'
      - 'src/cinepulse/gpu_compositor.py'
      - 'src/cinepulse/overlay_composer.py'
      - 'src/cinepulse/ui/composer_view.py'
      - 'tests/test_composer_*.py'
      - 'tests/test_gpu_compositor.py'
      - 'tests/test_component_identity.py'
      - 'tests/test_performance_policy.py'
      - 'tests/test_pipeline_budget.py'
      - 'tests/test_pipeline_runtime.py'
      - 'tests/test_adaptive_runtime.py'
      - 'tests/test_hardware_telemetry.py'
      - 'tests/test_realesrgan_tuning.py'
      - 'tests/test_realesrgan_benchmark.py'
      - 'tests/test_rife_tuning.py'
      - 'tests/recovery_gpu_acceptance.py'
      - 'tests/integration_smoke.py'

permissions:
  contents: read

concurrency:
  group: gpu-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nvidia-windows:
    name: NVIDIA target-machine acceptance
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Faysk')
    runs-on: [self-hosted, Windows, X64, cinepulse-gpu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - name: GPU inventory
        shell: pwsh
        run: |
          nvidia-smi
          if ($LASTEXITCODE -ne 0) { throw 'NVIDIA driver/GPU unavailable.' }
      - name: Install hash-locked audit runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest install failed.' }
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked core runtime install failed.' }
          python -m pip install --disable-pip-version-check --no-deps --editable .
          if ($LASTEXITCODE -ne 0) { throw 'CinePulse editable install failed.' }
          python -c "import cinepulse, sys; print('CINEPULSE_GPU_AUDIT_RUNTIME', cinepulse.__version__, sys.version.split()[0])"
          if ($LASTEXITCODE -ne 0) { throw 'CinePulse runtime import failed.' }
      - name: Bootstrap local production components
        shell: pwsh
        run: |
          ./installer/Start-CinePulse.ps1 -InstallOnly
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained component bootstrap failed.' }
      - name: Verify isolated environment and neural lock
        shell: pwsh
        run: |
          ./scripts/Test-IsolatedEnvironment.ps1 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Environment isolation failed.' }
          ./scripts/Test-NeuralInstaller.ps1 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Neural runtime resolver failed.' }
      - name: GPU gate
        run: python scripts/ci_gate.py --profile gpu --output artifacts/ci/gpu-windows.json
      - name: Recovery RIFE 8K UHD acceptance
        run: python tests/recovery_gpu_acceptance.py
      - name: Upload GPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cinepulse-gpu-acceptance
          path: |
            artifacts/ci/*.json
            data/test-runs/**/report.json
            data/logs/installer.log
          if-no-files-found: warn
