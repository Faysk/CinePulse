name: Temporary Preview Composer Export Test

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-composer-export-test.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install --disable-pip-version-check --editable .
      - name: Focused export and parity gate
        run: |
          python -m compileall -q src/cinepulse/composer_export.py src/cinepulse/composer_runtime.py src/cinepulse/composer_resample.py src/cinepulse/composer_decode.py src/cinepulse/composer_audio.py src/cinepulse/composer_audio_binding.py
          python -m unittest tests.test_composer_export tests.test_composer_resample tests.test_composer_runtime tests.test_composer_decode tests.test_composer_audio tests.test_composer_audio_binding tests.test_composer_media tests.test_overlay_composer tests.test_visualizer_geometry tests.test_visualizer_renderer
      - name: Remove temporary writer
        if: ${{ always() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin preview-restoration-lab || true
          git rm -f .github/workflows/_tmp-composer-export-test.yml || true
          git commit -m "chore: remove temporary composer export gate" || true
          git push origin HEAD:preview-restoration-lab || true
