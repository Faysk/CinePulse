name: Temporary H4 Windows Cancellation Fix

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h4-cancel-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Apply H4 cancellation fix
        run: python scripts/_tmp_h4_cancel_fix.py
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed' }
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Compile package
        run: python -m compileall -q src/cinepulse tests
      - name: Process control unit tests
        run: python -m unittest discover -s tests -p 'test_process_control.py'
      - name: H4 overlap contract
        run: python -m unittest discover -s tests -p 'test_h4_overlap_contract.py'
      - name: Windows cancel recovery integration
        run: python tests/integration_cancel.py
      - name: Commit fix and remove temporary writer
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp-h4-cancel-fix.yml scripts/_tmp_h4_cancel_fix.py
          git add src/cinepulse/studio.py src/cinepulse/process_control.py
          git commit -m "Hardware H4: harden Windows cancellation and frame tolerance"
          git push origin HEAD:preview-restoration-lab
