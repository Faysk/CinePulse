name: Temporary H8 Throughput Runtime

on:
  push:
    branches:
      - preview-restoration-lab
    paths:
      - .github/workflows/_tmp-h8-throughput-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
          fetch-depth: 0
      - name: Integrate measured neural throughput
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          studio = "src/cinepulse/studio.py"

          # Feed measured completed-work rates from successful neural chunks to
          # the corresponding H8 controller. The runtime guard remains callable
          # with no arguments and stays backward compatible.
          replace_once(
              studio,
              '''                    runtime_guard=h5_ai_guard,\n                )\n''',
              '''                    runtime_guard=h5_ai_guard,\n                    runtime_reporter=h5_ai_controller.record_throughput,\n                )\n''',
          )
          # Two RIFE call sites use the same controller/reporter.
          target = Path(studio)
          text = target.read_text(encoding="utf-8")
          old = '''                        runtime_guard=h5_rife_guard,\n                    )\n'''
          if text.count(old) != 2:
              raise SystemExit(f"{studio}: expected two RIFE call matches, found {text.count(old)}")
          text = text.replace(
              old,
              '''                        runtime_guard=h5_rife_guard,\n                        runtime_reporter=h5_rife_controller.record_throughput,\n                    )\n''',
          )
          target.write_text(text, encoding="utf-8", newline="\n")

          replace_once(
              studio,
              '''        overlap_pack: bool = False,\n        runtime_guard: Callable[[], RuntimePressureDecision] | None = None,\n    ) -> tuple[str, int, int]:\n''',
              '''        overlap_pack: bool = False,\n        runtime_guard: Callable[[], RuntimePressureDecision] | None = None,\n        runtime_reporter: Callable[[float], None] | None = None,\n    ) -> tuple[str, int, int]:\n''',
          )
          replace_once(
              studio,
              '''        overlap_extract: bool = False,\n        runtime_guard: Callable[[], RuntimePressureDecision] | None = None,\n    ) -> str:\n''',
              '''        overlap_extract: bool = False,\n        runtime_guard: Callable[[], RuntimePressureDecision] | None = None,\n        runtime_reporter: Callable[[float], None] | None = None,\n    ) -> str:\n''',
          )

          replace_once(
              studio,
              '''                        self._run_ai(\n                            command, outgoing, frames,\n                            stage_base + weight * fraction_chunk * 0.18,\n                            weight * fraction_chunk * 0.58,\n                        )\n                        produced = len(list(outgoing.glob("frame*.png")))\n''',
              '''                        neural_started = time.monotonic()\n                        self._run_ai(\n                            command, outgoing, frames,\n                            stage_base + weight * fraction_chunk * 0.18,\n                            weight * fraction_chunk * 0.58,\n                        )\n                        neural_elapsed = max(1e-6, time.monotonic() - neural_started)\n                        produced = len(list(outgoing.glob("frame*.png")))\n''',
          )
          replace_once(
              studio,
              '''                        active_policy = policy\n                        break\n''',
              '''                        if runtime_reporter is not None:\n                            runtime_reporter(produced / neural_elapsed)\n                        active_policy = policy\n                        break\n''',
          )

          replace_once(
              studio,
              '''                process = subprocess.Popen(\n                    command,\n''',
              '''                neural_started = time.monotonic()\n                process = subprocess.Popen(\n                    command,\n''',
          )
          replace_once(
              studio,
              '''                frames = sorted(outgoing.glob("*.png"))\n                if len(frames) < max(2, desired - 1):\n                    raise RuntimeError(f"RIFE produziu {len(frames)} de {desired} quadros esperados no lote.")\n\n                self._set_stage("RIFE 3/3", f"Lote {chunk_index}: compactando lossless e liberando PNGs.")\n''',
              '''                neural_elapsed = max(1e-6, time.monotonic() - neural_started)\n                frames = sorted(outgoing.glob("*.png"))\n                if len(frames) < max(2, desired - 1):\n                    raise RuntimeError(f"RIFE produziu {len(frames)} de {desired} quadros esperados no lote.")\n                if runtime_reporter is not None:\n                    runtime_reporter(len(frames) / neural_elapsed)\n\n                self._set_stage("RIFE 3/3", f"Lote {chunk_index}: compactando lossless e liberando PNGs.")\n''',
          )

          # Keep signature-level integration tests honest.
          path = Path("tests/test_h5_runtime_integration.py")
          if path.is_file():
              text = path.read_text(encoding="utf-8")
              old = '''        self.assertIsNone(ai.parameters["runtime_guard"].default)\n        self.assertIsNone(rife.parameters["runtime_guard"].default)\n'''
              new = '''        self.assertIsNone(ai.parameters["runtime_guard"].default)\n        self.assertIsNone(rife.parameters["runtime_guard"].default)\n        self.assertIsNone(ai.parameters["runtime_reporter"].default)\n        self.assertIsNone(rife.parameters["runtime_reporter"].default)\n'''
              if old in text:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          Path("tests/test_adaptive_runtime.py").write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom cinepulse.adaptive_runtime import AdaptiveRuntimeController\nfrom cinepulse.hardware_telemetry import GpuSample, HardwareSample\n\n\ndef sample(*, ram: float | None = 40.0, temperature: float | None = 60.0, vram_free: float | None = 6000.0, gpu_index: int = 0) -> HardwareSample:\n    return HardwareSample(\n        timestamp=1.0, monotonic=1.0, stage="IA 2/3", cpu_total_percent=50.0,\n        cpu_per_logical_percent=(), ram_total_mb=65536.0, ram_used_mb=None,\n        ram_available_mb=None, ram_percent=ram, disk_read_mbps=100.0, disk_write_mbps=100.0,\n        gpus=(GpuSample(index=gpu_index, name="GPU", temperature_c=temperature, vram_free_mb=vram_free),),\n    )\n\n\nclass AdaptiveRuntimeControllerTests(unittest.TestCase):\n    def test_healthy_sample_preserves_h4_envelope(self) -> None:\n        controller = AdaptiveRuntimeController(allow_extract_overlap=True, allow_pack_overlap=True)\n        decision = controller.observe(sample())\n        self.assertEqual(0, decision.level)\n        self.assertEqual(1.0, decision.chunk_scale)\n        self.assertTrue(decision.allow_extract_overlap)\n        self.assertTrue(decision.allow_pack_overlap)\n\n    def test_temperature_alone_never_downshifts(self) -> None:\n        controller = AdaptiveRuntimeController(allow_extract_overlap=True, allow_pack_overlap=True)\n        decision = controller.observe(sample(temperature=95.0))\n        self.assertEqual(0, decision.level)\n        self.assertTrue(decision.allow_extract_overlap)\n        self.assertEqual(1.0, decision.chunk_scale)\n\n    def test_capacity_caution_disables_overlap_and_reduces_future_chunks(self) -> None:\n        controller = AdaptiveRuntimeController(allow_extract_overlap=True, allow_pack_overlap=True)\n        decision = controller.observe(sample(ram=90.0))\n        self.assertEqual(1, decision.level)\n        self.assertFalse(decision.allow_extract_overlap)\n        self.assertEqual(75, decision.limit_chunk_frames(100))\n        self.assertIn("RAM 90.0%", decision.reasons)\n\n    def test_critical_capacity_pressure_halves_future_chunk_limit(self) -> None:\n        controller = AdaptiveRuntimeController(allow_extract_overlap=True, allow_pack_overlap=True)\n        decision = controller.observe(sample(ram=95.0, temperature=95.0, vram_free=300.0))\n        self.assertEqual(2, decision.level)\n        self.assertEqual(50, decision.limit_chunk_frames(100))\n        self.assertFalse(decision.allow_extract_overlap)\n\n    def test_controller_never_ramps_back_up_during_same_render(self) -> None:\n        controller = AdaptiveRuntimeController(allow_extract_overlap=True, allow_pack_overlap=True)\n        self.assertEqual(1, controller.observe(sample(ram=90.0)).level)\n        healthy = controller.observe(sample(temperature=60.0, ram=30.0, vram_free=7000.0))\n        self.assertEqual(1, healthy.level)\n        self.assertFalse(healthy.allow_extract_overlap)\n\n    def test_configured_gpu_is_used_for_capacity_evidence(self) -> None:\n        controller = AdaptiveRuntimeController(gpu_index=1, allow_extract_overlap=True, allow_pack_overlap=True)\n        payload = HardwareSample(\n            timestamp=1.0, monotonic=1.0, stage="RIFE 2/3", cpu_total_percent=20.0,\n            cpu_per_logical_percent=(), ram_total_mb=65536.0, ram_used_mb=None,\n            ram_available_mb=None, ram_percent=40.0, disk_read_mbps=None, disk_write_mbps=None,\n            gpus=(\n                GpuSample(index=0, name="GPU0", temperature_c=95.0, vram_free_mb=100.0),\n                GpuSample(index=1, name="GPU1", temperature_c=65.0, vram_free_mb=5000.0),\n            ),\n        )\n        self.assertEqual(0, controller.observe(payload).level)\n\n    def test_rife_minimum_can_be_kept_at_two_frames_under_capacity_pressure(self) -> None:\n        controller = AdaptiveRuntimeController(allow_extract_overlap=True)\n        decision = controller.observe(sample(vram_free=300.0))\n        self.assertEqual(2, decision.limit_chunk_frames(2, minimum=2))\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8", newline="\n")

          Path("tests/test_overnight_runtime.py").write_text('''from __future__ import annotations\n\nfrom pathlib import Path\nimport unittest\n\nfrom cinepulse.hardware_telemetry import GpuSample, HardwareSample\nfrom cinepulse.overnight_runtime import OvernightRuntimeController\n\n\ndef sample(*, temp: float = 70.0, gpu_util: float = 90.0, power: float = 80.0, power_limit: float = 140.0, clock: float = 2200.0, ram: float = 60.0, read: float = 20.0, write: float = 30.0) -> HardwareSample:\n    gpu = GpuSample(index=0, name="RTX Test", utilization_percent=gpu_util, power_w=power, power_limit_w=power_limit, temperature_c=temp, graphics_clock_mhz=clock)\n    return HardwareSample(timestamp=1.0, monotonic=1.0, stage="neural", cpu_total_percent=60.0, cpu_per_logical_percent=(60.0, 60.0), ram_total_mb=64000.0, ram_used_mb=32000.0, ram_available_mb=32000.0, ram_percent=ram, disk_read_mbps=read, disk_write_mbps=write, gpus=(gpu,))\n\n\nclass OvernightRuntimeTests(unittest.TestCase):\n    def warmup(self, controller: OvernightRuntimeController, rate: float = 100.0) -> None:\n        for _ in range(controller.window):\n            controller.record_throughput(rate)\n            controller.observe(sample())\n\n    def test_healthy_window_keeps_benchmark_proven_envelope(self) -> None:\n        controller = OvernightRuntimeController(window=3, baseline_overlap_depth=3, scratch_sustainable_mbps=500)\n        self.warmup(controller)\n        decision = controller.observe(sample())\n        self.assertEqual(0, decision.pressure_level)\n        self.assertEqual(3, decision.overlap_depth)\n\n    def test_sustained_heat_without_throughput_loss_does_not_downshift(self) -> None:\n        controller = OvernightRuntimeController(window=2, baseline_overlap_depth=3)\n        self.warmup(controller)\n        for _ in range(4):\n            controller.record_throughput(103.0)\n            decision = controller.observe(sample(temp=92.0))\n        self.assertEqual(0, decision.pressure_level)\n        self.assertEqual(3, decision.overlap_depth)\n\n    def test_heat_plus_measured_throughput_regression_downshifts(self) -> None:\n        controller = OvernightRuntimeController(window=2, baseline_overlap_depth=3)\n        self.warmup(controller)\n        for _ in range(2):\n            controller.record_throughput(86.0)\n            decision = controller.observe(sample(temp=87.0))\n        self.assertEqual(2, decision.pressure_level)\n        self.assertEqual(1, decision.overlap_depth)\n        self.assertTrue(any("throughput" in reason for reason in decision.reasons))\n\n    def test_power_limit_alone_does_not_downshift_when_throughput_holds(self) -> None:\n        controller = OvernightRuntimeController(window=2)\n        self.warmup(controller)\n        for _ in range(2):\n            controller.record_throughput(101.0)\n            decision = controller.observe(sample(gpu_util=70.0, power=138.0, power_limit=140.0))\n        self.assertEqual(0, decision.pressure_level)\n\n    def test_power_pressure_with_real_throughput_loss_reduces_upstream_pressure(self) -> None:\n        controller = OvernightRuntimeController(window=2)\n        self.warmup(controller)\n        for _ in range(2):\n            controller.record_throughput(90.0)\n            decision = controller.observe(sample(gpu_util=70.0, power=138.0, power_limit=140.0))\n        self.assertGreaterEqual(decision.pressure_level, 2)\n        self.assertTrue(any("potência" in reason for reason in decision.reasons))\n\n    def test_scratch_saturation_reduces_overlap_directly(self) -> None:\n        controller = OvernightRuntimeController(window=2, scratch_sustainable_mbps=100.0)\n        controller.observe(sample(read=45.0, write=50.0))\n        decision = controller.observe(sample(read=45.0, write=50.0))\n        self.assertEqual(2, decision.pressure_level)\n        self.assertEqual(1, decision.overlap_depth)\n\n    def test_reported_instability_is_direct_safety_signal(self) -> None:\n        controller = OvernightRuntimeController(window=2)\n        controller.record_instability()\n        controller.observe(sample(temp=60.0))\n        decision = controller.observe(sample(temp=60.0))\n        self.assertEqual(3, decision.pressure_level)\n        self.assertEqual(10.0, decision.cooldown_hint_seconds)\n\n    def test_decisions_are_monotonic_inside_one_render(self) -> None:\n        controller = OvernightRuntimeController(window=2, scratch_sustainable_mbps=100.0)\n        controller.observe(sample(read=50.0, write=50.0))\n        hot = controller.observe(sample(read=50.0, write=50.0))\n        for _ in range(4):\n            cool = controller.observe(sample(read=0.0, write=0.0))\n        self.assertEqual(hot.pressure_level, cool.pressure_level)\n\n    def test_h8_control_plane_cannot_mutate_global_machine_policy(self) -> None:\n        root = Path(__file__).resolve().parents[1] / "src" / "cinepulse"\n        control_plane = "\\n".join((root / name).read_text(encoding="utf-8").lower() for name in ("overnight_runtime.py", "adaptive_runtime.py"))\n        for token in ("import subprocess", "from subprocess", "powercfg", "realtime_priority_class", "priority_realtime", "nvidia-settings", "nvidia-smi -pl", "nvidia-smi --power-limit"):\n            self.assertNotIn(token, control_plane, token)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8", newline="\n")

          Path("tests/test_h8_adaptive_integration.py").write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom cinepulse.adaptive_runtime import AdaptiveRuntimeController\nfrom cinepulse.hardware_telemetry import GpuSample, HardwareSample\n\n\ndef sample(*, temp: float = 70.0, power: float = 80.0, limit: float = 140.0, util: float = 90.0) -> HardwareSample:\n    return HardwareSample(timestamp=1.0, monotonic=1.0, stage="IA 2/3", cpu_total_percent=60.0, cpu_per_logical_percent=(), ram_total_mb=65536.0, ram_used_mb=32000.0, ram_available_mb=32000.0, ram_percent=50.0, disk_read_mbps=20.0, disk_write_mbps=30.0, gpus=(GpuSample(index=0, name="RTX Test", utilization_percent=util, power_w=power, power_limit_w=limit, temperature_c=temp, graphics_clock_mhz=2200.0, vram_free_mb=5000.0),))\n\n\nclass H8AdaptiveIntegrationTests(unittest.TestCase):\n    def warmup(self, controller: AdaptiveRuntimeController, rate: float = 100.0) -> None:\n        for _ in range(2):\n            controller.record_throughput(rate)\n            controller.observe(sample())\n\n    def test_normal_mode_ignores_heat_and_power_without_capacity_pressure(self) -> None:\n        controller = AdaptiveRuntimeController(allow_extract_overlap=True, allow_pack_overlap=True)\n        for _ in range(4):\n            decision = controller.observe(sample(temp=95.0, power=139.0, limit=140.0, util=70.0))\n        self.assertEqual(0, decision.level)\n        self.assertEqual(1.0, decision.cpu_scale)\n        self.assertTrue(decision.allow_extract_overlap)\n\n    def test_overnight_power_pressure_requires_measured_slowdown(self) -> None:\n        controller = AdaptiveRuntimeController(overnight=True, overnight_window=2, allow_extract_overlap=True, allow_pack_overlap=True)\n        self.warmup(controller)\n        for _ in range(2):\n            controller.record_throughput(90.0)\n            decision = controller.observe(sample(power=139.0, limit=140.0, util=70.0))\n        self.assertEqual(2, decision.level)\n        self.assertFalse(decision.allow_extract_overlap)\n        self.assertLess(decision.cpu_scale, 1.0)\n\n    def test_overnight_hot_but_fast_stays_at_proven_envelope(self) -> None:\n        controller = AdaptiveRuntimeController(overnight=True, overnight_window=2, allow_extract_overlap=True, allow_pack_overlap=True)\n        self.warmup(controller)\n        for _ in range(2):\n            controller.record_throughput(104.0)\n            decision = controller.observe(sample(temp=94.0))\n        self.assertEqual(0, decision.level)\n        self.assertEqual(1.0, decision.cpu_scale)\n        self.assertTrue(decision.allow_extract_overlap)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8", newline="\n")
          PY
      - name: Rewrite H8 physical acceptance comparison
        shell: bash
        run: |
          cat > scripts/overnight_acceptance.py <<'PY'
          from __future__ import annotations

          """Analyze one physical H8 overnight run without changing the system.

          Temperature is evidence, not a comfort gate. Physical H8 acceptance
          compares the sustained candidate against a conservative baseline for
          the same scenario and rejects throughput collapse, quality loss,
          instability or capacity exhaustion.
          """

          import argparse
          import json
          from pathlib import Path
          from typing import Any, Mapping

          from cinepulse.hardware_telemetry import BENCHMARK_SCENARIOS, load_telemetry
          from cinepulse.hardware_throughput import throughput_from_telemetry


          def _number(value: Any) -> float | None:
              try:
                  return float(value) if value is not None else None
              except (TypeError, ValueError):
                  return None


          def _wall(payload: Mapping[str, Any]) -> float:
              summary = payload.get("summary") if isinstance(payload.get("summary"), Mapping) else {}
              return _number(summary.get("wall_seconds")) or 0.0


          def analyze(
              telemetry: Mapping[str, Any],
              *,
              baseline_telemetry: Mapping[str, Any] | None,
              scenario: str,
              minimum_seconds: float,
              quality_passed: bool,
          ) -> dict[str, Any]:
              summary = telemetry.get("summary") if isinstance(telemetry.get("summary"), Mapping) else {}
              overall = summary.get("overall") if isinstance(summary.get("overall"), Mapping) else {}
              gpu = overall.get("gpu") if isinstance(overall.get("gpu"), Mapping) else {}
              disk = overall.get("disk") if isinstance(overall.get("disk"), Mapping) else {}
              ram = overall.get("ram") if isinstance(overall.get("ram"), Mapping) else {}

              wall = _wall(telemetry)
              baseline_wall = _wall(baseline_telemetry or {})
              sustained_speedup = baseline_wall / wall if baseline_wall > 0 and wall > 0 else None
              sample_count = int(overall.get("sample_count") or 0)
              interval = _number(telemetry.get("sample_interval_seconds")) or 2.0
              expected_samples = max(1, int(wall / max(0.5, interval) * 0.70))
              peak_temp = _number(gpu.get("peak_temperature_c"))
              min_vram = _number(gpu.get("minimum_vram_free_mb"))
              peak_ram = _number(ram.get("peak_percent"))
              peak_write = _number(disk.get("peak_write_mbps"))
              avg_write = _number(disk.get("average_write_mbps"))

              checks: dict[str, bool] = {
                  "known_scenario": scenario in BENCHMARK_SCENARIOS,
                  "render_success": str(telemetry.get("status") or "").lower() == "success",
                  "sustained_duration": wall >= max(1.0, float(minimum_seconds)),
                  "telemetry_coverage": sample_count >= expected_samples,
                  "quality_and_integrity_passed": bool(quality_passed),
                  "gpu_temperature_observed": peak_temp is not None,
                  "ram_pressure_safe": peak_ram is None or peak_ram < 96.0,
                  "vram_not_exhausted": min_vram is None or min_vram >= 256.0,
                  "baseline_present": baseline_wall > 0,
                  # Up to 3% wall-time noise is tolerated; worse than that is a
                  # sustained-throughput regression and cannot be accepted.
                  "sustained_throughput_not_worse": sustained_speedup is not None and sustained_speedup >= 0.97,
              }
              passed = all(checks.values())
              throughput = throughput_from_telemetry(telemetry)
              baseline_throughput = throughput_from_telemetry(baseline_telemetry or {})

              notes: list[str] = []
              if peak_temp is not None and peak_temp >= 84.0:
                  notes.append(
                      "GPU ran hot; temperature alone is not a rejection. Confirm the candidate still wins sustained throughput and remains stable."
                  )
              if avg_write is not None and peak_write is not None and peak_write > 0 and avg_write / peak_write >= 0.85:
                  notes.append("Scratch write throughput stayed near its observed peak; storage saturation may be a sustained bottleneck.")
              if not throughput.get("stages"):
                  notes.append("No stage emitted explicit frame work units; wall-time comparison remains authoritative for this exact scenario.")

              return {
                  "schema": 2,
                  "scenario": scenario,
                  "scenario_contract": BENCHMARK_SCENARIOS.get(scenario),
                  "physical_acceptance": "exact-run-pass-not-global" if passed else "rejected-or-incomplete",
                  "passed": passed,
                  "checks": checks,
                  "evidence": {
                      "wall_seconds": wall,
                      "baseline_wall_seconds": baseline_wall or None,
                      "sustained_speedup_vs_baseline": sustained_speedup,
                      "sample_count": sample_count,
                      "sample_interval_seconds": interval,
                      "peak_gpu_temperature_c": peak_temp,
                      "minimum_vram_free_mb": min_vram,
                      "peak_ram_percent": peak_ram,
                      "average_disk_write_mbps": avg_write,
                      "peak_disk_write_mbps": peak_write,
                      "throughput": throughput,
                      "baseline_throughput": baseline_throughput,
                  },
                  "notes": notes,
                  "system_mutations_performed": False,
              }


          def parser() -> argparse.ArgumentParser:
              result = argparse.ArgumentParser(description="Validate one sustained CinePulse H8 physical overnight run.")
              result.add_argument("telemetry", type=Path)
              result.add_argument("--baseline-telemetry", type=Path, required=True)
              result.add_argument("--scenario", required=True, choices=sorted(BENCHMARK_SCENARIOS))
              result.add_argument("--minimum-seconds", type=float, default=1800.0)
              result.add_argument("--quality-passed", action="store_true", help="Set only after the normal CinePulse verification/quality gates for this exact output passed.")
              result.add_argument("--output", type=Path)
              return result


          def main() -> int:
              args = parser().parse_args()
              payload = analyze(
                  load_telemetry(args.telemetry),
                  baseline_telemetry=load_telemetry(args.baseline_telemetry),
                  scenario=args.scenario,
                  minimum_seconds=args.minimum_seconds,
                  quality_passed=args.quality_passed,
              )
              text = json.dumps(payload, indent=2, ensure_ascii=False) + "\n"
              if args.output:
                  args.output.parent.mkdir(parents=True, exist_ok=True)
                  args.output.write_text(text, encoding="utf-8")
              print(text, end="")
              return 0 if payload["passed"] else 2


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > tests/test_overnight_acceptance.py <<'PY'
          from __future__ import annotations

          import unittest

          from scripts.overnight_acceptance import analyze


          def telemetry(*, wall=3600.0, temp=78.0, status="success", sample_count=1800):
              return {
                  "status": status,
                  "sample_interval_seconds": 2.0,
                  "stage_events": [{"stage": "IA 2/3", "detail": "Lote 1: Real-ESRGAN em 120 quadro(s)."}],
                  "summary": {
                      "wall_seconds": wall,
                      "stages": {"IA 2/3": {"wall_seconds": 20.0}},
                      "overall": {
                          "sample_count": sample_count,
                          "gpu": {"peak_temperature_c": temp, "minimum_vram_free_mb": 1024.0},
                          "ram": {"peak_percent": 75.0},
                          "disk": {"average_write_mbps": 300.0, "peak_write_mbps": 500.0},
                      },
                  },
              }


          class OvernightAcceptanceTests(unittest.TestCase):
              def test_sustained_candidate_can_pass_against_baseline(self) -> None:
                  result = analyze(telemetry(wall=3600), baseline_telemetry=telemetry(wall=3900), scenario="1080p30_to_4k60", minimum_seconds=1800, quality_passed=True)
                  self.assertTrue(result["passed"])
                  self.assertGreater(result["evidence"]["sustained_speedup_vs_baseline"], 1.0)
                  self.assertEqual(6.0, result["evidence"]["throughput"]["stages"]["IA 2/3"]["units_per_second"])

              def test_hot_but_faster_stable_run_is_not_rejected_for_temperature(self) -> None:
                  result = analyze(telemetry(wall=3500, temp=94.0), baseline_telemetry=telemetry(wall=3900), scenario="1080p30_to_4k60", minimum_seconds=1800, quality_passed=True)
                  self.assertTrue(result["passed"])
                  self.assertTrue(result["checks"]["gpu_temperature_observed"])
                  self.assertTrue(any("temperature alone" in note for note in result["notes"]))

              def test_missing_quality_gate_rejects(self) -> None:
                  result = analyze(telemetry(), baseline_telemetry=telemetry(wall=3900), scenario="720p24_to_8k120_music", minimum_seconds=1800, quality_passed=False)
                  self.assertFalse(result["passed"])

              def test_sustained_throughput_regression_rejects_even_when_cool(self) -> None:
                  result = analyze(telemetry(wall=4200, temp=65.0, sample_count=2100), baseline_telemetry=telemetry(wall=3600), scenario="1080p30_to_4k60", minimum_seconds=1800, quality_passed=True)
                  self.assertFalse(result["checks"]["sustained_throughput_not_worse"])
                  self.assertFalse(result["passed"])

              def test_missing_baseline_rejects_physical_acceptance(self) -> None:
                  result = analyze(telemetry(), baseline_telemetry=None, scenario="1080p30_to_4k60", minimum_seconds=1800, quality_passed=True)
                  self.assertFalse(result["checks"]["baseline_present"])
                  self.assertFalse(result["passed"])

              def test_sparse_telemetry_rejects(self) -> None:
                  result = analyze(telemetry(sample_count=10), baseline_telemetry=telemetry(wall=3900), scenario="1080p30_to_4k60", minimum_seconds=1800, quality_passed=True)
                  self.assertFalse(result["checks"]["telemetry_coverage"])


          if __name__ == "__main__":
              unittest.main()
          PY
