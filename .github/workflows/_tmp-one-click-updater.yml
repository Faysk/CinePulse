name: Temporary One Click Updater Integrator

on:
  push:
    branches:
      - feature/one-click-updater

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/one-click-updater
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Patch Studio updater UX
        shell: pwsh
        run: |
          python scripts/_tmp_patch_updater.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q src/cinepulse/studio.py src/cinepulse/update_manager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests -p test_update_manager.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit integration and clean temporary helpers
        shell: pwsh
        run: |
          git config user.name "Faysk"
          git config user.email "faysk.nan@gmail.com"
          git rm .github/workflows/_tmp-one-click-updater.yml scripts/_tmp_patch_updater.py
          git add src/cinepulse/studio.py
          git commit -m "Updater: add startup notification and one-click install UX"
          git push origin HEAD:feature/one-click-updater
