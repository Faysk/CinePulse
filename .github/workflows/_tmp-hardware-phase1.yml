name: Temporary Hardware Phase 1 Integrator

on:
  push:
    branches:
      - preview-restoration-lab
    paths:
      - .github/workflows/_tmp-hardware-phase1.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: preview-restoration-lab
          fetch-depth: 0
      - name: Materialize Phase 1 payload
        shell: bash
        run: |
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/hwphase1.tgz"
          tar -xzf "$RUNNER_TEMP/hwphase1.tgz"
          python patch_phase1.py
          rm patch_phase1.py
      - name: Focused tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          PYTHONPATH=src python -m pytest -q tests/test_hardware_telemetry.py tests/test_render_history_telemetry.py tests/test_render_history.py tests/test_diagnostics.py ||           PYTHONPATH=src python -m pytest -q tests/test_hardware_telemetry.py tests/test_render_history_telemetry.py tests/test_render_history.py
      - name: Commit integrated Phase 1 and remove temporary writer
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp-hardware-phase1.yml
          git add src/cinepulse/hardware_telemetry.py src/cinepulse/render_history.py src/cinepulse/diagnostics.py tests/test_hardware_telemetry.py tests/test_render_history_telemetry.py scripts/hardware_benchmark.py docs/HARDWARE_UTILIZATION_PHASE1.md
          git commit -m "Hardware Phase 1: add render telemetry baseline"
          git push origin HEAD:preview-restoration-lab
