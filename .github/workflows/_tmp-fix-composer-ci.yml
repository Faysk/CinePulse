name: Temporary Composer CI Repair

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-fix-composer-ci.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Repair Preview composer entry and VFR normalization
        shell: python
        run: |
          from pathlib import Path

          studio = Path('src/cinepulse/studio.py')
          text = studio.read_text(encoding='utf-8')
          anchor = '''        ttk.Button(header_tools, text="Ajuda  F1", command=self._show_quick_guide).pack(side="left")\n'''
          addition = '''        ttk.Button(header_tools, text="Overlay Composer • Preview", command=self._show_overlay_composer).pack(side="left", padx=(0, 8))\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('header tools anchor not found')
              text = text.replace(anchor, addition + anchor, 1)

          method_anchor = '''    def _show_quick_guide(self) -> None:\n        show_quick_guide(self)\n'''
          method = '''    def _show_overlay_composer(self) -> None:\n        # Preview-only lazy import keeps Stable startup and RenderSettings isolated.\n        from .ui.composer_view import show_overlay_composer\n        show_overlay_composer(self)\n\n'''
          if method not in text:
              if method_anchor not in text:
                  raise SystemExit('quick guide method anchor not found')
              text = text.replace(method_anchor, method + method_anchor, 1)
          studio.write_text(text, encoding='utf-8', newline='\n')

          media = Path('src/cinepulse/composer_media.py')
          text = media.read_text(encoding='utf-8')
          old = '''    starts = [max(0.0, value - base) for value in timestamps]\n    starts[0] = 0.0\n'''
          new = '''    # Normalize decimal FFprobe timestamps to stable binary floats.  This keeps\n    # VFR timing authoritative without leaking subtraction noise such as\n    # 0.10000000000000009 into persisted/equality-sensitive contracts.\n    starts = [max(0.0, round(value - base, 12)) for value in timestamps]\n    starts[0] = 0.0\n'''
          if old not in text:
              raise SystemExit('VFR normalization anchor not found')
          media.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Focused regression gate
        run: |
          python -m pip install --disable-pip-version-check --editable .
          python -m compileall -q src tests
          python -m unittest tests.test_composer_studio_integration tests.test_composer_media_timing tests.test_composer_media tests.test_composer_runtime tests.test_overlay_composer -v
      - name: Commit repair and remove temporary writer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cinepulse/studio.py src/cinepulse/composer_media.py
          git commit -m "fix: restore Preview composer entry and stable VFR timing"
          git rm .github/workflows/_tmp-fix-composer-ci.yml
          git commit -m "chore: remove temporary composer repair workflow"
          git push origin HEAD:preview-restoration-lab
