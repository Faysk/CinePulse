name: Apply storage duration hotfix

on:
  push:
    branches:
      - hotfix-1.1.3-storage-duration
    paths:
      - .github/workflows/hotfix-storage-duration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch storage estimator, call sites and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'pattern is not unique in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          storage = Path('src/cinepulse/storage_engine.py')
          text = storage.read_text(encoding='utf-8-sig')
          text = text.replace(
              '''class StorageStageEstimate:\n    key: str\n    title: str\n    persistent_gb: float\n    working_set_gb: float\n    peak_scratch_gb: float\n    detail: str\n\n    def line(self) -> str:\n        return (\n            f"{self.title}: persistente ~{self.persistent_gb:.2f} GB • "\n            f"workset ~{self.working_set_gb:.2f} GB • pico ~{self.peak_scratch_gb:.2f} GB — {self.detail}"\n        )\n''',
              '''class StorageStageEstimate:\n    key: str\n    title: str\n    persistent_gb: float\n    working_set_gb: float\n    peak_scratch_gb: float\n    duration_seconds: float\n    detail: str\n\n    def line(self) -> str:\n        return (\n            f"{self.title}: persistente ~{self.persistent_gb:.2f} GB • "\n            f"workset ~{self.working_set_gb:.2f} GB • pico ~{self.peak_scratch_gb:.2f} GB • "\n            f"duração materializada ~{self.duration_seconds:.1f}s — {self.detail}"\n        )\n''',
              1,
          )
          text = text.replace(
              '''class StorageEstimate:\n    output_gb: float\n    peak_scratch_gb: float\n    persistent_scratch_gb: float\n    cache_growth_gb: float\n    stages: tuple[StorageStageEstimate, ...]\n    ai_chunk_frames: int\n    rife_chunk_frames: int\n    architecture_version: str = "core-integrity-phase6-storage-engine"\n''',
              '''class StorageEstimate:\n    output_gb: float\n    peak_scratch_gb: float\n    persistent_scratch_gb: float\n    cache_growth_gb: float\n    stages: tuple[StorageStageEstimate, ...]\n    ai_chunk_frames: int\n    rife_chunk_frames: int\n    clip_duration_seconds: float = 0.0\n    project_duration_seconds: float = 0.0\n    architecture_version: str = "core-integrity-phase6-storage-engine-stage-duration-v2"\n''',
              1,
          )
          start = text.index('def estimate_storage(\n')
          end = text.index('\n\ndef safe_rmtree', start)
          new_function = '''def estimate_storage(\n    plan: RenderPlan,\n    *,\n    output_gb: float,\n    duration: float | None = None,\n    clip_duration: float | None = None,\n    project_duration: float | None = None,\n    cache_current_gb: float = 0.0,\n    cache_quota_gb: float = DEFAULT_CACHE_QUOTA_GB,\n    chunk_budget_gb: float = DEFAULT_CHUNK_BUDGET_GB,\n) -> StorageEstimate:\n    """Estimate scratch/cache pressure from the durations each stage materializes.\n\n    ``clip_duration`` is the duration of the reusable visual clip before a music\n    loop is expanded. ``project_duration`` is the final timeline duration (for\n    example the music length).  The legacy ``duration`` argument remains as a\n    compatibility fallback and maps to both values.\n\n    In music mode the expensive pre-loop stages (color prepass, Real-ESRGAN,\n    master and loop transition) operate on the reusable clip only.  VFX, final\n    RIFE and delivery operate on the expanded project timeline.  Treating every\n    stage as project-long was the 1.1.2 false-terabyte preflight bug.\n    """\n\n    if project_duration is None:\n        project_duration = duration\n    if clip_duration is None:\n        clip_duration = duration if duration is not None else project_duration\n    if project_duration is None or clip_duration is None:\n        raise TypeError("estimate_storage requires duration or both clip_duration/project_duration")\n\n    clip_seconds = max(0.01, float(clip_duration))\n    project_seconds = max(0.01, float(project_duration))\n    # Original-video projects have one timeline.  Keeping this normalization\n    # here prevents an accidental caller mismatch from under-estimating stages.\n    if plan.project_mode != "music":\n        clip_seconds = project_seconds\n\n    def stage_duration(key: str) -> float:\n        if plan.project_mode == "music" and key in {"color", "enhancement", "master", "transition"}:\n            return clip_seconds\n        return project_seconds\n\n    stages: list[StorageStageEstimate] = []\n    current_persistent = 0.0\n    peak = 0.0\n    cache_growth = 0.0\n\n    ai = plan.step("enhancement")\n    rife = plan.step("rife_final")\n    color = plan.step("color")\n    ai_will_attempt = ai.attempts and plan.enhancement_mode == "realesrgan"\n    rife_will_attempt = rife.attempts and plan.interpolation_mode == "rife"\n    color_prepass = color.runs and (ai_will_attempt or (rife_will_attempt and not plan.needs_master))\n\n    # The worker materializes an explicit lossless color prepass only when a\n    # neural stage is the first consumer.  Otherwise color conversion is fused\n    # into the master/final filter and does not create a separate scratch file.\n    if color_prepass and color.output_spec is not None:\n        seconds = stage_duration("color")\n        converted = _compressed_gb(color.output_spec, seconds, lossless=True)\n        stage_peak = current_persistent + converted\n        stages.append(StorageStageEstimate(\n            "color", "Gerenciamento de cor", converted, converted, stage_peak, seconds,\n            "prepass lossless explícito antes do primeiro estágio neural.",\n        ))\n        current_persistent = converted\n        peak = max(peak, stage_peak)\n\n    ai_chunk = MAX_CHUNK_FRAMES\n    if ai.attempts and ai.input_spec and ai.output_spec and ai.materializes_frames:\n        seconds = stage_duration("enhancement")\n        ai_chunk = choose_chunk_frames(ai.input_spec, ai.output_spec, budget_gb=chunk_budget_gb)\n        working = _neural_chunk_gb(ai.input_spec, ai.output_spec, ai_chunk)\n        enhanced = _compressed_gb(ai.output_spec, seconds, lossless=True)\n        # Chunk videos coexist with the assembled cache only during concat.\n        # A color prepass, when present, also remains live until AI promotion.\n        stage_peak = max(current_persistent + working, current_persistent + enhanced * 2.05)\n        cache_growth = min(enhanced, cache_quota_gb) if cache_quota_gb > 0 else 0.0\n        stages.append(StorageStageEstimate(\n            "enhancement", "Real-ESRGAN em chunks", 0.0, working, stage_peak, seconds,\n            f"{ai_chunk} quadro(s)/lote; PNGs são descartados e o master (~{enhanced:.2f} GB) é promovido ao cache.",\n        ))\n        # The assembled AI master is atomically moved to cache and the optional\n        # color prepass is released by the worker after successful promotion.\n        current_persistent = 0.0\n        peak = max(peak, stage_peak)\n\n    for key in ("master", "transition", "vfx"):\n        step = plan.step(key)\n        if not step.runs or step.output_spec is None:\n            continue\n        seconds = stage_duration(key)\n        produced = _compressed_gb(step.output_spec, seconds, lossless=not step.lossy_intermediate)\n        # During production, previous visual source and new file overlap. Once\n        # the stage succeeds the worker releases the consumed scratch source.\n        stage_peak = current_persistent + produced\n        stages.append(StorageStageEstimate(\n            key, step.title, produced, produced, stage_peak, seconds,\n            "intermediário anterior é liberado após a promoção desta etapa.",\n        ))\n        current_persistent = produced\n        peak = max(peak, stage_peak)\n\n    rife_chunk = MAX_CHUNK_FRAMES\n    if rife.attempts and rife.input_spec and rife.output_spec and rife.materializes_frames:\n        seconds = stage_duration("rife_final")\n        ratio = rife.output_spec.fps / max(1.0, rife.input_spec.fps)\n        rife_chunk = choose_chunk_frames(\n            rife.input_spec, rife.output_spec, budget_gb=chunk_budget_gb,\n            output_frames_per_input=ratio,\n        )\n        working = _neural_chunk_gb(\n            rife.input_spec, rife.output_spec, rife_chunk,\n            output_frames_per_input=ratio,\n        )\n        interpolated = _compressed_gb(rife.output_spec, seconds, lossless=True)\n        stage_peak = max(current_persistent + working, current_persistent + interpolated * 2.05)\n        stages.append(StorageStageEstimate(\n            "rife_final", "RIFE em chunks", interpolated, working, stage_peak, seconds,\n            f"{rife_chunk} quadro(s) fonte/lote; entrada/saída PNG não cobrem mais o projeto inteiro.",\n        ))\n        current_persistent = interpolated\n        peak = max(peak, stage_peak)\n\n    # Final encoding overlaps the latest visual intermediate with the partial\n    # output, but the partial file belongs to the output volume.\n    final_seconds = stage_duration("finalize")\n    stages.append(StorageStageEstimate(\n        "finalize", "Codificação final", current_persistent, 0.0, current_persistent, final_seconds,\n        f"arquivo parcial de saída estimado separadamente em ~{max(0.0, output_gb):.2f} GB.",\n    ))\n    peak = max(peak, current_persistent)\n\n    return StorageEstimate(\n        output_gb=max(0.0, float(output_gb)),\n        peak_scratch_gb=max(0.25, peak),\n        persistent_scratch_gb=current_persistent,\n        cache_growth_gb=max(0.0, cache_growth),\n        stages=tuple(stages),\n        ai_chunk_frames=ai_chunk,\n        rife_chunk_frames=rife_chunk,\n        clip_duration_seconds=clip_seconds,\n        project_duration_seconds=project_seconds,\n    )\n'''
          text = text[:start] + new_function + text[end:]
          storage.write_text(text, encoding='utf-8')

          studio = Path('src/cinepulse/studio.py')
          replace_once(
              studio,
              '''        storage_estimate = estimate_storage(\n            render_plan,\n            duration=project_duration,\n            output_gb=output_gb,\n            cache_current_gb=cache_current_gb,\n            cache_quota_gb=settings.cache_quota_gb,\n        )\n''',
              '''        storage_estimate = estimate_storage(\n            render_plan,\n            clip_duration=source_duration,\n            project_duration=project_duration,\n            output_gb=output_gb,\n            cache_current_gb=cache_current_gb,\n            cache_quota_gb=settings.cache_quota_gb,\n        )\n''',
          )
          replace_once(
              studio,
              '''            storage_contract = estimate_storage(\n                render_plan, duration=project_duration, output_gb=estimated_output_gb,\n                cache_current_gb=cache_usage_bytes(PATHS.cache) / (1024 ** 3),\n                cache_quota_gb=settings.cache_quota_gb,\n            )\n''',
              '''            storage_contract = estimate_storage(\n                render_plan, clip_duration=video_duration, project_duration=project_duration,\n                output_gb=estimated_output_gb,\n                cache_current_gb=cache_usage_bytes(PATHS.cache) / (1024 ** 3),\n                cache_quota_gb=settings.cache_quota_gb,\n            )\n''',
          )
          replace_once(
              studio,
              '''            f"Pico scratch estimado: {temp_gb:.2f} GB",\n            f"Scratch: {scratch_path}",\n''',
              '''            f"Pico scratch estimado: {temp_gb:.2f} GB",\n            f"Duração materializada do clipe: {format_time(storage_estimate.clip_duration_seconds)}",\n            f"Duração do projeto final: {format_time(storage_estimate.project_duration_seconds)}",\n            f"Scratch: {scratch_path}",\n''',
          )

          tests = Path('tests/test_storage_engine.py')
          test_text = tests.read_text(encoding='utf-8-sig')
          marker = '''    def test_estimator_skips_ai_for_downscale(self):\n'''
          if marker not in test_text:
              raise SystemExit('storage test insertion marker missing')
          regression = '''    def test_music_loop_uses_clip_duration_before_timeline_expansion(self):\n        plan = self._plan(\n            source_width=1280, source_height=720, source_fps=24,\n            target_width=7680, target_height=4320, target_fps=120,\n            effects_active=True, transition_active=True,\n        )\n        short = estimate_storage(\n            plan, clip_duration=10, project_duration=10, output_gb=1.0, cache_quota_gb=50,\n        )\n        long = estimate_storage(\n            plan, clip_duration=10, project_duration=264, output_gb=20.0, cache_quota_gb=50,\n        )\n        short_by_key = {stage.key: stage for stage in short.stages}\n        long_by_key = {stage.key: stage for stage in long.stages}\n        for key in ("enhancement", "master", "transition"):\n            self.assertAlmostEqual(short_by_key[key].duration_seconds, 10.0)\n            self.assertAlmostEqual(long_by_key[key].duration_seconds, 10.0)\n            self.assertAlmostEqual(short_by_key[key].peak_scratch_gb, long_by_key[key].peak_scratch_gb, places=6)\n        self.assertAlmostEqual(short.cache_growth_gb, long.cache_growth_gb, places=6)\n        self.assertAlmostEqual(long_by_key["vfx"].duration_seconds, 264.0)\n        self.assertAlmostEqual(long_by_key["rife_final"].duration_seconds, 264.0)\n        self.assertGreater(long_by_key["vfx"].persistent_gb, short_by_key["vfx"].persistent_gb * 20)\n        self.assertEqual(long.clip_duration_seconds, 10.0)\n        self.assertEqual(long.project_duration_seconds, 264.0)\n\n    def test_color_prepass_is_counted_at_clip_duration(self):\n        plan = self._plan(\n            source_bit_depth=10, source_pixel_format="yuv420p10le",\n            source_primaries="bt709", source_transfer="bt709", source_space="bt709", source_range="tv",\n        )\n        estimate = estimate_storage(\n            plan, clip_duration=8, project_duration=240, output_gb=10, cache_quota_gb=50,\n        )\n        by_key = {stage.key: stage for stage in estimate.stages}\n        self.assertIn("color", by_key)\n        self.assertAlmostEqual(by_key["color"].duration_seconds, 8.0)\n        self.assertAlmostEqual(by_key["enhancement"].duration_seconds, 8.0)\n        self.assertAlmostEqual(by_key["vfx"].duration_seconds, 240.0)\n\n    def test_legacy_duration_keeps_single_timeline_compatibility(self):\n        estimate = estimate_storage(self._plan(), duration=30, output_gb=1.2)\n        self.assertEqual(estimate.clip_duration_seconds, 30.0)\n        self.assertEqual(estimate.project_duration_seconds, 30.0)\n\n'''
          test_text = test_text.replace(marker, regression + marker, 1)
          tests.write_text(test_text, encoding='utf-8')

          integration = Path('tests/integration_storage.py')
          integration_text = integration.read_text(encoding='utf-8-sig')
          integration_text = integration_text.replace(
              '"-f", "lavfi", "-i", "sine=frequency=660:sample_rate=48000:duration=0.8",',
              '"-f", "lavfi", "-i", "sine=frequency=660:sample_rate=48000:duration=2.4",',
              1,
          )
          old_assert = '''        if "storage_estimate" not in report or "scratch_probe" not in report:\n            raise RuntimeError("Contrato de armazenamento ausente do preflight.")\n'''
          new_assert = '''        if "storage_estimate" not in report or "scratch_probe" not in report:\n            raise RuntimeError("Contrato de armazenamento ausente do preflight.")\n        estimate = report["storage_estimate"]\n        if not (0.70 <= float(estimate["clip_duration_seconds"]) <= 1.0):\n            raise RuntimeError(f"Preflight perdeu a duração real do clipe: {estimate['clip_duration_seconds']}")\n        if not (2.2 <= float(estimate["project_duration_seconds"]) <= 2.6):\n            raise RuntimeError(f"Preflight perdeu a duração da música: {estimate['project_duration_seconds']}")\n        master = next((stage for stage in estimate["stages"] if stage["key"] == "master"), None)\n        if master is None or float(master["duration_seconds"]) > 1.0:\n            raise RuntimeError(f"Master do loop foi estimado com a duração do projeto: {master}")\n'''
          if old_assert not in integration_text:
              raise SystemExit('integration assertion marker missing')
          integration_text = integration_text.replace(old_assert, new_assert, 1)
          integration.write_text(integration_text, encoding='utf-8')
          PY
      - name: Remove temporary writer workflow and commit hotfix
        shell: bash
        run: |
          git rm .github/workflows/hotfix-storage-duration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cinepulse/storage_engine.py src/cinepulse/studio.py tests/test_storage_engine.py tests/integration_storage.py
          git commit -m "fix: make storage estimates stage-duration aware"
          git push origin HEAD:hotfix-1.1.3-storage-duration
