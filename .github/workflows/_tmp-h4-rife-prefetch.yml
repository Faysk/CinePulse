name: Temporary Hardware H4 RIFE Prefetch Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h4-rife-prefetch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fix generated RIFE error-tail escaping
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/_tmp_h4_rife_prefetch.py")
          text = path.read_text(encoding="utf-8")
          old = 'raise RuntimeError("RIFE falhou.\\n" + "\\n".join(recent))'
          new = 'raise RuntimeError("RIFE falhou.\\\\n" + "\\\\n".join(recent))'
          if old not in text:
              raise SystemExit("RIFE error-tail escape anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
      - name: Integrate bounded RIFE prefetch
        run: python scripts/_tmp_h4_rife_prefetch.py
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Compile Studio on Python 3.11
        run: python -m py_compile src/cinepulse/studio.py
      - name: Compile package
        run: python -m compileall -q src/cinepulse
      - name: Pipeline runtime tests
        run: python -m unittest discover -s tests -p 'test_pipeline_runtime.py'
      - name: Pipeline budget tests
        run: python -m unittest discover -s tests -p 'test_pipeline_budget.py'
      - name: RIFE engine tests
        run: python -m unittest discover -s tests -p 'test_rife_engine.py'
      - name: RIFE tuning tests
        run: python -m unittest discover -s tests -p 'test_rife_tuning.py'
      - name: RIFE safe runner tests
        run: python -m unittest discover -s tests -p 'test_rife_safe_runner.py'
      - name: RIFE runtime rollback tests
        run: python -m unittest discover -s tests -p 'test_rife_runtime_fallback.py'
      - name: Commit integration and remove temporary writers
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp-h4-rife-prefetch.yml scripts/_tmp_h4_rife_prefetch.py
          git add src/cinepulse/studio.py
          git commit -m "Hardware H4: prefetch RIFE input with bounded backpressure"
          git push origin HEAD:preview-restoration-lab
