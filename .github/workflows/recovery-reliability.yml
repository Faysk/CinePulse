name: Recovery Reliability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-source:
    name: Recovery fault gate · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Recovery source/fault gate
        run: python scripts/recovery_fault_gate.py --profile source --output artifacts/ci/recovery-${{ runner.os }}.json
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-${{ runner.os }}
          path: artifacts/ci/recovery-*.json
          if-no-files-found: error

  recovery-media:
    name: Recovery media commit · Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Recovery media fault gate
        run: python scripts/recovery_fault_gate.py --profile media --output artifacts/ci/recovery-media-linux.json
      - name: Upload recovery media evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-media-linux
          path: artifacts/ci/recovery-media-linux.json
          if-no-files-found: error
