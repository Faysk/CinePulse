name: Release Metadata

on:
  workflow_dispatch:
  push:
    branches: [recovery-reliability-megapack]
    paths:
      - 'scripts/finalize_release_metadata.py'
      - '.github/workflows/release-metadata.yml'

permissions:
  contents: write

concurrency:
  group: release-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: recovery-reliability-megapack
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Synchronize audit metadata
        run: python scripts/finalize_release_metadata.py
      - name: Commit synchronized metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cinepulse/render_plan.py
          if git diff --cached --quiet; then
            echo 'Release metadata already current.'
            exit 0
          fi
          git commit -m 'docs: synchronize resolved release audit codes [skip release-metadata]'
          git push origin HEAD:recovery-reliability-megapack
