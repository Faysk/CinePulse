name: Installer v2 MSI Patch

on:
  push:
    branches: [installer-v2-self-contained]
    paths:
      - 'scripts/_installer_v2_msi_patch.py'
      - '.github/workflows/installer-v2-msi-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'Faysk'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: installer-v2-self-contained
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Apply MSI build patch
        run: python scripts/_installer_v2_msi_patch.py
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Build-Msi.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; throw 'Build-Msi parse failed.' }
      - name: Verify MSI directory UI contract
        shell: pwsh
        run: |
          $build = Get-Content scripts/Build-Msi.ps1 -Raw
          $wxs = Get-Content installer/wix/Product.wxs -Raw
          if ($build -notmatch 'WixToolset\.UI\.wixext') { throw 'WiX UI extension missing from build.' }
          if ($wxs -notmatch 'WixUI_InstallDir') { throw 'MSI install directory dialog missing.' }
          if ($wxs -notmatch 'InstallDirectory="INSTALLFOLDER"') { throw 'INSTALLFOLDER is not user-selectable.' }
      - name: Commit MSI build integration
        shell: bash
        run: |
          if git diff --quiet -- scripts/Build-Msi.ps1; then
            echo 'MSI build already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/Build-Msi.ps1
          git commit -m 'installer v2: build MSI with install-directory wizard'
          git push origin HEAD:installer-v2-self-contained
