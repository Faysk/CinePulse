name: Temporary Final Preview Polish

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-final-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply final polish
        run: python scripts/_tmp_final_polish.py
      - name: Install project
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Compile project
        run: python -m compileall -q src/cinepulse tests scripts
      - name: Restoration regression suite
        run: python -m unittest discover -s tests -p 'test_restoration*.py'
      - name: H4/H5 safety suite
        run: |
          python -m unittest discover -s tests -p 'test_h4_overlap_contract.py'
          python -m unittest discover -s tests -p 'test_adaptive_runtime.py'
          python -m unittest discover -s tests -p 'test_h5_runtime_integration.py'
          python -m unittest discover -s tests -p 'test_process_control.py'
      - name: Remove temporary writers before final static audit
        shell: bash
        run: git rm .github/workflows/_tmp-final-polish.yml scripts/_tmp_final_polish.py
      - name: Final static audit
        run: python scripts/final_audit.py
      - name: Commit final polish
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md src/cinepulse/studio.py
          git commit -m "Final audit: polish Preview release candidate"
          git push origin HEAD:preview-restoration-lab
