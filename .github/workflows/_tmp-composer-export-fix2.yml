name: Temporary Composer Export Decoder Fix

on:
  push:
    branches:
      - preview-restoration-lab
    paths:
      - .github/workflows/_tmp-composer-export-fix2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/_tmp_fix_composer_export.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install --disable-pip-version-check --editable .
      - run: python -m unittest tests.test_composer_export tests.test_composer_resample tests.test_composer_runtime tests.test_composer_decode tests.test_composer_audio tests.test_composer_audio_binding tests.test_composer_media
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cinepulse/composer_export.py
          git rm .github/workflows/_tmp-composer-export-fix2.yml scripts/_tmp_fix_composer_export.py
          git commit -m "Preview composer: fix reference decode and diagnostics"
          git push origin HEAD:preview-restoration-lab
