name: Apply fused VFX delivery hotfix

on:
  push:
    branches:
      - hotfix-1.1.3-storage-duration
    paths:
      - .github/workflows/hotfix-fused-vfx.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fuse project-long music VFX with final delivery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # --------------------------------------------------------------
          # VFX encoder: allow the project-long VFX pass to be the final
          # delivery encode. This keeps the lossless reusable clip/master,
          # but never writes a project-long FFV1 VFX intermediate.
          # --------------------------------------------------------------
          vfx = Path('src/cinepulse/vfx.py')
          replace_once(
              vfx,
              '''    output_range: str = "tv",\n    lossless_intermediate: bool = False,\n) -> None:\n''',
              '''    output_range: str = "tv",\n    lossless_intermediate: bool = False,\n    final_video_args: list[str] | None = None,\n    final_audio_source: str | None = None,\n    final_audio_filter: str = "",\n    final_audio_args: list[str] | None = None,\n    final_muxer_args: list[str] | None = None,\n) -> None:\n''',
          )
          replace_once(
              vfx,
              '''    command = [\n        ffmpeg,\n        "-y",\n        "-hide_banner",\n        "-loglevel",\n        "error",\n        "-stream_loop",\n        "-1",\n        "-i",\n        master_video,\n        "-f",\n        "rawvideo",\n        "-pix_fmt",\n        "rgba",\n        "-s",\n        f"{spec.width}x{spec.height}",\n        "-r",\n        f"{spec.fps:.8f}",\n        "-i",\n        "pipe:0",\n        "-filter_complex",\n        build_vfx_filter_graph(\n            output_width,\n            output_height,\n            spec.width,\n            spec.height,\n            output_pixel_format=output_pixel_format,\n            output_primaries=output_primaries,\n            output_transfer=output_transfer,\n            output_space=output_space,\n            output_range=output_range,\n        ),\n        "-map",\n        "[vout]",\n        "-an",\n        "-t",\n        f"{duration:.6f}",\n        "-r",\n        f"{output_fps:.8f}",\n    ]\n    if lossless_intermediate:\n        command += [\n            "-c:v", "ffv1", "-level", "3", "-coder", "1", "-context", "1",\n            "-g", "1", "-slicecrc", "1", "-pix_fmt", output_pixel_format,\n        ]\n    elif use_cpu:\n        command += ["-c:v", "libx264", "-preset", "medium", "-crf", "12", "-pix_fmt", output_pixel_format]\n    else:\n        command += [\n            "-c:v",\n            "h264_nvenc",\n            "-preset",\n            "p7",\n            "-tune",\n            "hq",\n            "-rc",\n            "vbr",\n            "-cq",\n            "10",\n            "-b:v",\n            bitrate,\n            "-maxrate",\n            maxrate,\n            "-bufsize",\n            bufsize,\n            "-g",\n            "30",\n            "-bf",\n            "2",\n            "-pix_fmt",\n            output_pixel_format,\n        ]\n    command += [\n        "-color_primaries",\n        output_primaries,\n        "-color_trc",\n        output_transfer,\n        "-colorspace",\n        output_space,\n        "-color_range",\n        "pc" if output_range in {"pc", "full"} else "tv",\n        "-threads",\n        str(max(1, cpu_threads)),\n    ]\n    if not lossless_intermediate:\n        command += ["-movflags", "+faststart"]\n    command += [output_path]\n''',
              '''    final_delivery = final_video_args is not None\n    command = [\n        ffmpeg,\n        "-y",\n        "-hide_banner",\n        "-loglevel",\n        "error",\n        "-stream_loop",\n        "-1",\n        "-i",\n        master_video,\n        "-f",\n        "rawvideo",\n        "-pix_fmt",\n        "rgba",\n        "-s",\n        f"{spec.width}x{spec.height}",\n        "-r",\n        f"{spec.fps:.8f}",\n        "-i",\n        "pipe:0",\n    ]\n    if final_delivery and final_audio_source:\n        command += ["-i", final_audio_source]\n    command += [\n        "-filter_complex",\n        build_vfx_filter_graph(\n            output_width,\n            output_height,\n            spec.width,\n            spec.height,\n            output_pixel_format=output_pixel_format,\n            output_primaries=output_primaries,\n            output_transfer=output_transfer,\n            output_space=output_space,\n            output_range=output_range,\n        ),\n        "-map",\n        "[vout]",\n    ]\n    if final_delivery and final_audio_source:\n        # Inputs are: 0=loop master, 1=raw VFX pipe, 2=delivery audio.\n        command += ["-map", "2:a:0"]\n    else:\n        command += ["-an"]\n    command += ["-t", f"{duration:.6f}", "-r", f"{output_fps:.8f}"]\n\n    if final_delivery:\n        command += list(final_video_args or ())\n    elif lossless_intermediate:\n        command += [\n            "-c:v", "ffv1", "-level", "3", "-coder", "1", "-context", "1",\n            "-g", "1", "-slicecrc", "1", "-pix_fmt", output_pixel_format,\n        ]\n    elif use_cpu:\n        command += ["-c:v", "libx264", "-preset", "medium", "-crf", "12", "-pix_fmt", output_pixel_format]\n    else:\n        command += [\n            "-c:v",\n            "h264_nvenc",\n            "-preset",\n            "p7",\n            "-tune",\n            "hq",\n            "-rc",\n            "vbr",\n            "-cq",\n            "10",\n            "-b:v",\n            bitrate,\n            "-maxrate",\n            maxrate,\n            "-bufsize",\n            bufsize,\n            "-g",\n            "30",\n            "-bf",\n            "2",\n            "-pix_fmt",\n            output_pixel_format,\n        ]\n    command += [\n        "-color_primaries",\n        output_primaries,\n        "-color_trc",\n        output_transfer,\n        "-colorspace",\n        output_space,\n        "-color_range",\n        "pc" if output_range in {"pc", "full"} else "tv",\n        "-threads",\n        str(max(1, cpu_threads)),\n    ]\n    if final_delivery:\n        if final_audio_source:\n            if final_audio_filter:\n                command += ["-af", final_audio_filter]\n            command += list(final_audio_args or ())\n        command += list(final_muxer_args or ())\n    elif not lossless_intermediate:\n        command += ["-movflags", "+faststart"]\n    command += [output_path]\n''',
          )

          # --------------------------------------------------------------
          # Storage estimator: project-long VFX in music mode is streamed
          # straight to AtomicOutput when there is no later RIFE stage.
          # --------------------------------------------------------------
          storage = Path('src/cinepulse/storage_engine.py')
          st = storage.read_text(encoding='utf-8-sig')
          old_loop = '''    for key in ("master", "transition", "vfx"):\n        step = plan.step(key)\n        if not step.runs or step.output_spec is None:\n            continue\n        seconds = stage_duration(key)\n        produced = _compressed_gb(step.output_spec, seconds, lossless=not step.lossy_intermediate)\n        # During production, previous visual source and new file overlap. Once\n        # the stage succeeds the worker releases the consumed scratch source.\n        stage_peak = current_persistent + produced\n        stages.append(StorageStageEstimate(\n            key, step.title, produced, produced, stage_peak, seconds,\n            "intermediário anterior é liberado após a promoção desta etapa.",\n        ))\n        current_persistent = produced\n        peak = max(peak, stage_peak)\n\n'''
          new_loop = '''    for key in ("master", "transition"):\n        step = plan.step(key)\n        if not step.runs or step.output_spec is None:\n            continue\n        seconds = stage_duration(key)\n        produced = _compressed_gb(step.output_spec, seconds, lossless=not step.lossy_intermediate)\n        # During production, previous visual source and new file overlap. Once\n        # the stage succeeds the worker releases the consumed scratch source.\n        stage_peak = current_persistent + produced\n        stages.append(StorageStageEstimate(\n            key, step.title, produced, produced, stage_peak, seconds,\n            "intermediário anterior é liberado após a promoção desta etapa.",\n        ))\n        current_persistent = produced\n        peak = max(peak, stage_peak)\n\n    vfx = plan.step("vfx")\n    fused_vfx_delivery = bool(\n        plan.project_mode == "music" and vfx.runs and not rife.attempts\n    )\n    if vfx.runs and vfx.output_spec is not None:\n        seconds = stage_duration("vfx")\n        if fused_vfx_delivery:\n            # The lossless reusable clip/master remains scratch while FFmpeg\n            # consumes it, but the project-long composed video is encoded\n            # directly into AtomicOutput on the output volume. No giant FFV1\n            # VFX master is materialized on scratch.\n            stage_peak = current_persistent\n            stages.append(StorageStageEstimate(\n                "vfx", "VFX reativos + entrega final", 0.0, 0.0, stage_peak, seconds,\n                "VFX do projeto inteiro são compostos e codificados por streaming direto na saída final; nenhum master VFX full-length é gravado no scratch.",\n            ))\n            peak = max(peak, stage_peak)\n            current_persistent = 0.0\n        else:\n            produced = _compressed_gb(vfx.output_spec, seconds, lossless=not vfx.lossy_intermediate)\n            stage_peak = current_persistent + produced\n            stages.append(StorageStageEstimate(\n                "vfx", vfx.title, produced, produced, stage_peak, seconds,\n                "intermediário VFX é necessário porque ainda existe uma etapa visual posterior.",\n            ))\n            current_persistent = produced\n            peak = max(peak, stage_peak)\n\n'''
          if st.count(old_loop) != 1:
              raise SystemExit('storage: stage loop mismatch')
          st = st.replace(old_loop, new_loop, 1)
          storage.write_text(st, encoding='utf-8')

          # --------------------------------------------------------------
          # Worker: when music VFX is terminal, master audio first and let the
          # same FFmpeg process perform composition + final delivery.
          # --------------------------------------------------------------
          studio = Path('src/cinepulse/studio.py')
          s = studio.read_text(encoding='utf-8-sig')
          old_vfx = '''                if effects_active:\n                    vfx_output = self._temp_file(job_dir, "studio_vfx_", temp_paths, suffix=master_suffix)\n                    self._set_stage("VFX dinâmicos", "Reutilizando o envelope musical completo e desenhando VFX target-aware.")\n                    remaining_for_vfx = 35 if settings.mode == MODE_MUSIC else 45\n                    reactive_audio = audio_source\n                    if settings.use_stems:\n                        try:\n                            reactive_audio = self._prepare_reactive_audio(\n                                audio_source, settings.audio_focus, settings.use_cpu, settings.cpu_threads,\n                            )\n                        except InterruptedError:\n                            raise\n                        except Exception as exc:\n                            self._log(f"Demucs indisponível; VFX seguirá a mistura original: {exc}")\n                    previous_visual = visual_source\n                    try:\n                        vfx.render_vfx_intermediate(\n                            FFMPEG, visual_source, reactive_audio, str(vfx_output), project_duration,\n                            settings.effects, settings.color, settings.intensity, settings.occupancy,\n                            work_w, work_h, work_fps, "100M" if max(work_w, work_h) > 1280 else "50M",\n                            "180M", "360M", settings.use_cpu, settings.cpu_threads,\n                            settings.audio_focus, settings.reaction_smoothing, settings.reaction_expression,\n                            settings.dynamic_sections, settings.section_dynamics,\n                            lambda fraction: self._push_progress(progress_base + remaining_for_vfx * fraction),\n                            lambda: self._cancelled,\n                            lambda process: setattr(self, "_process", process),\n                            self._log,\n                            analysis_duration=full_analysis_duration,\n                            analysis_offset=0.0,\n                            output_pixel_format=color_plan.working_pix_fmt,\n                            output_primaries=color_plan.working.primaries,\n                            output_transfer=color_plan.working.transfer,\n                            output_space=color_plan.working.space,\n                            output_range=color_plan.working.range,\n                            lossless_intermediate=color_plan.needs_lossless_intermediate,\n                        )\n                    except vfx.RenderCancelled as exc:\n                        raise InterruptedError from exc\n                    visual_source = str(vfx_output)\n                    self._release_temp_path(previous_visual, temp_paths)\n                    progress_base += remaining_for_vfx\n                    color_already_converted = True\n\n'''
          new_vfx = '''                finalized_in_vfx = False\n                if effects_active:\n                    # Music VFX is the only project-long visual stage after the\n                    # loop-aware RIFE hotfix. Fuse it with delivery so 8K/120\n                    # never writes a full-length lossless VFX intermediate.\n                    fuse_vfx_delivery = (\n                        settings.mode == MODE_MUSIC\n                        and not render_plan.step("rife_final").attempts\n                    )\n                    vfx_output = (\n                        partial_output\n                        if fuse_vfx_delivery\n                        else self._temp_file(job_dir, "studio_vfx_", temp_paths, suffix=master_suffix)\n                    )\n                    self._set_stage(\n                        "VFX dinâmicos",\n                        "Compondo VFX e codificando diretamente a saída final."\n                        if fuse_vfx_delivery\n                        else "Reutilizando o envelope musical completo e desenhando VFX target-aware.",\n                    )\n                    remaining_for_vfx = max(1.0, 95.0 - progress_base) if fuse_vfx_delivery else (35 if settings.mode == MODE_MUSIC else 45)\n                    reactive_audio = audio_source\n                    if settings.use_stems:\n                        try:\n                            reactive_audio = self._prepare_reactive_audio(\n                                audio_source, settings.audio_focus, settings.use_cpu, settings.cpu_threads,\n                            )\n                        except InterruptedError:\n                            raise\n                        except Exception as exc:\n                            self._log(f"Demucs indisponível; VFX seguirá a mistura original: {exc}")\n\n                    final_audio_filter = ""\n                    final_video_args = None\n                    final_audio_args = None\n                    final_muxer_args = None\n                    final_audio_source = None\n                    if fuse_vfx_delivery:\n                        measurements = None\n                        if settings.audio_mode != "Preservar dinâmica original":\n                            self._set_stage("Áudio 1/2", "Medindo loudness, true peak e faixa dinâmica da trilha completa.")\n                            try:\n                                measurements = analyze_loudness(FFMPEG, audio_source, project_duration, settings.audio_mode)\n                                self._log(f"Medição de loudness: {measurements}")\n                            except Exception as exc:\n                                self._log(f"Medição em duas passagens indisponível; usando normalização dinâmica: {exc}")\n                        final_audio_filter = build_audio_filter(settings.audio_mode, measurements)\n                        final_video_args = delivery_plan.video_args(\n                            use_cpu=settings.use_cpu, nvenc_available=self._nvenc,\n                            bitrate_mbps=estimated_bitrate, fps=target_fps,\n                        ) + color_plan.metadata_args(output=True)\n                        final_audio_source = settings.audio\n                        final_audio_args = delivery_plan.audio_args()\n                        final_muxer_args = delivery_plan.muxer_args()\n                        self._log(\n                            "STORAGE Hotfix 1.1.3: VFX full-length será entregue por streaming; "\n                            "nenhum FFV1 full-length será materializado no scratch."\n                        )\n\n                    previous_visual = visual_source\n                    try:\n                        vfx.render_vfx_intermediate(\n                            FFMPEG, visual_source, reactive_audio, str(vfx_output), project_duration,\n                            settings.effects, settings.color, settings.intensity, settings.occupancy,\n                            work_w, work_h, work_fps, "100M" if max(work_w, work_h) > 1280 else "50M",\n                            "180M", "360M", settings.use_cpu, settings.cpu_threads,\n                            settings.audio_focus, settings.reaction_smoothing, settings.reaction_expression,\n                            settings.dynamic_sections, settings.section_dynamics,\n                            lambda fraction: self._push_progress(progress_base + remaining_for_vfx * fraction),\n                            lambda: self._cancelled,\n                            lambda process: setattr(self, "_process", process),\n                            self._log,\n                            analysis_duration=full_analysis_duration,\n                            analysis_offset=0.0,\n                            output_pixel_format=color_plan.working_pix_fmt,\n                            output_primaries=color_plan.working.primaries,\n                            output_transfer=color_plan.working.transfer,\n                            output_space=color_plan.working.space,\n                            output_range=color_plan.working.range,\n                            lossless_intermediate=color_plan.needs_lossless_intermediate and not fuse_vfx_delivery,\n                            final_video_args=final_video_args,\n                            final_audio_source=final_audio_source,\n                            final_audio_filter=final_audio_filter,\n                            final_audio_args=final_audio_args,\n                            final_muxer_args=final_muxer_args,\n                        )\n                    except vfx.RenderCancelled as exc:\n                        raise InterruptedError from exc\n                    self._release_temp_path(previous_visual, temp_paths)\n                    visual_source = str(vfx_output)\n                    progress_base += remaining_for_vfx\n                    color_already_converted = True\n                    finalized_in_vfx = fuse_vfx_delivery\n\n'''
          if s.count(old_vfx) != 1:
              raise SystemExit('studio: VFX block mismatch')
          s = s.replace(old_vfx, new_vfx, 1)

          old_final = '''            self._set_stage("Finalizando", f"Codificando em {target_w}×{target_h} a {target_fps} fps com áudio correto.")\n            final_input_spec = render_plan.step("finalize").input_spec\n            final_source_size = (\n                (final_input_spec.width, final_input_spec.height)\n                if final_input_spec is not None\n                else (working_w, working_h)\n            )\n            final_filter = self._scale_filter(\n                target_w, target_h, target_fps, settings.fit_mode, visual_fps, effective_interpolation,\n                spatial_mode=self._normalized_enhancement_mode(settings.enhancement),\n                source_size=final_source_size,\n                color_plan=color_plan,\n                color_already_converted=color_already_converted,\n            )\n            command = [FFMPEG, "-y", "-hide_banner", "-nostdin", "-loglevel", "error"]\n            if settings.mode == MODE_MUSIC and not effects_active:\n                command += ["-stream_loop", "-1"]\n            command += ["-i", visual_source]\n            if settings.mode == MODE_MUSIC:\n                command += ["-i", settings.audio, "-map", "0:v:0", "-map", "1:a:0"]\n            elif settings.preserve_audio and source_has_audio:\n                command += ["-i", settings.video, "-map", "0:v:0", "-map", "1:a:0"]\n            else:\n                command += ["-map", "0:v:0", "-an"]\n            command += ["-vf", final_filter]\n            bitrate_mbps = estimated_bitrate\n            command += delivery_plan.video_args(\n                use_cpu=settings.use_cpu, nvenc_available=self._nvenc,\n                bitrate_mbps=bitrate_mbps, fps=target_fps,\n            )\n            command += color_plan.metadata_args(output=True)\n            if settings.mode == MODE_MUSIC or (settings.preserve_audio and source_has_audio):\n                measurements = None\n                if settings.audio_mode != "Preservar dinâmica original":\n                    self._set_stage("Áudio 1/2", "Medindo loudness, true peak e faixa dinâmica da trilha completa.")\n                    try:\n                        measurements = analyze_loudness(FFMPEG, audio_source, project_duration, settings.audio_mode)\n                        self._log(f"Medição de loudness: {measurements}")\n                    except Exception as exc:\n                        self._log(f"Medição em duas passagens indisponível; usando normalização dinâmica: {exc}")\n                self._set_stage("Áudio 2/2", "Aplicando masterização e proteção de pico durante a codificação final.")\n                audio_filter = build_audio_filter(settings.audio_mode, measurements)\n                if audio_filter:\n                    command += ["-af", audio_filter]\n                command += delivery_plan.audio_args()\n            command += ["-threads", str(settings.cpu_threads), "-t", f"{project_duration:.6f}"]\n            command += delivery_plan.muxer_args()\n            command += ["-progress", "pipe:1", "-nostats", str(partial_output)]\n            self._run_ffmpeg(command, project_duration, progress_base, 100 - progress_base)\n            self._release_temp_path(visual_source, temp_paths)\n'''
          new_final = '''            if not finalized_in_vfx:\n                self._set_stage("Finalizando", f"Codificando em {target_w}×{target_h} a {target_fps} fps com áudio correto.")\n                final_input_spec = render_plan.step("finalize").input_spec\n                final_source_size = (\n                    (final_input_spec.width, final_input_spec.height)\n                    if final_input_spec is not None\n                    else (working_w, working_h)\n                )\n                final_filter = self._scale_filter(\n                    target_w, target_h, target_fps, settings.fit_mode, visual_fps, effective_interpolation,\n                    spatial_mode=self._normalized_enhancement_mode(settings.enhancement),\n                    source_size=final_source_size,\n                    color_plan=color_plan,\n                    color_already_converted=color_already_converted,\n                )\n                command = [FFMPEG, "-y", "-hide_banner", "-nostdin", "-loglevel", "error"]\n                if settings.mode == MODE_MUSIC and not effects_active:\n                    command += ["-stream_loop", "-1"]\n                command += ["-i", visual_source]\n                if settings.mode == MODE_MUSIC:\n                    command += ["-i", settings.audio, "-map", "0:v:0", "-map", "1:a:0"]\n                elif settings.preserve_audio and source_has_audio:\n                    command += ["-i", settings.video, "-map", "0:v:0", "-map", "1:a:0"]\n                else:\n                    command += ["-map", "0:v:0", "-an"]\n                command += ["-vf", final_filter]\n                bitrate_mbps = estimated_bitrate\n                command += delivery_plan.video_args(\n                    use_cpu=settings.use_cpu, nvenc_available=self._nvenc,\n                    bitrate_mbps=bitrate_mbps, fps=target_fps,\n                )\n                command += color_plan.metadata_args(output=True)\n                if settings.mode == MODE_MUSIC or (settings.preserve_audio and source_has_audio):\n                    measurements = None\n                    if settings.audio_mode != "Preservar dinâmica original":\n                        self._set_stage("Áudio 1/2", "Medindo loudness, true peak e faixa dinâmica da trilha completa.")\n                        try:\n                            measurements = analyze_loudness(FFMPEG, audio_source, project_duration, settings.audio_mode)\n                            self._log(f"Medição de loudness: {measurements}")\n                        except Exception as exc:\n                            self._log(f"Medição em duas passagens indisponível; usando normalização dinâmica: {exc}")\n                    self._set_stage("Áudio 2/2", "Aplicando masterização e proteção de pico durante a codificação final.")\n                    audio_filter = build_audio_filter(settings.audio_mode, measurements)\n                    if audio_filter:\n                        command += ["-af", audio_filter]\n                    command += delivery_plan.audio_args()\n                command += ["-threads", str(settings.cpu_threads), "-t", f"{project_duration:.6f}"]\n                command += delivery_plan.muxer_args()\n                command += ["-progress", "pipe:1", "-nostats", str(partial_output)]\n                self._run_ffmpeg(command, project_duration, progress_base, 100 - progress_base)\n                self._release_temp_path(visual_source, temp_paths)\n            else:\n                self._set_stage("Finalizando", "VFX e entrega já foram codificados no mesmo passe; iniciando verificação final.")\n                self._push_progress(98.0)\n'''
          if s.count(old_final) != 1:
              raise SystemExit('studio: final encode block mismatch')
          s = s.replace(old_final, new_final, 1)
          studio.write_text(s, encoding='utf-8')

          # --------------------------------------------------------------
          # RenderPlan disclosure and metadata.
          # --------------------------------------------------------------
          render_plan = Path('src/cinepulse/render_plan.py')
          rp = render_plan.read_text(encoding='utf-8-sig')
          rp = rp.replace(
              '''        temporal_note = (\n            "mantém a cadência efetiva da fonte para uma única interpolação RIFE posterior"\n            if data.interpolation_mode == "rife" and target.fps > source.fps + 0.01\n            else "usa diretamente a cadência solicitada; fontes mais rápidas só são reduzidas quando o destino pede menos FPS"\n        )\n''',
              '''        temporal_note = (\n            "recebe a cadência alvo do RIFE aplicado uma única vez ao clipe reutilizável"\n            if data.project_mode == "music" and rife_base_runs\n            else (\n                "mantém a cadência efetiva da fonte para uma única interpolação RIFE posterior"\n                if data.interpolation_mode == "rife" and target.fps > source.fps + 0.01\n                else "usa diretamente a cadência solicitada; fontes mais rápidas só são reduzidas quando o destino pede menos FPS"\n            )\n        )\n''',
              1,
          )
          rp = rp.replace(
              '''        "rife_calls_planned": int(rife_base_runs) + (1 if final_rife_runs and data.rife_available else 0),\n        "rife_loop_optimized": bool(rife_base_runs),\n''',
              '''        "rife_calls_planned": int(rife_base_runs) + (1 if final_rife_runs and data.rife_available else 0),\n        "rife_loop_optimized": bool(rife_base_runs),\n        "vfx_delivery_fused": bool(data.project_mode == "music" and data.effects_active and not final_rife_runs),\n''',
              1,
          )
          render_plan.write_text(rp, encoding='utf-8')

          # --------------------------------------------------------------
          # Tests: music plan uses rife_base, fused VFX stays bounded, and the
          # storage model explicitly discloses no full-length VFX scratch file.
          # --------------------------------------------------------------
          tests = Path('tests/test_storage_engine.py')
          t = tests.read_text(encoding='utf-8-sig')
          t = t.replace(
              '''        self.assertIn("enhancement", keys)\n        self.assertIn("rife_final", keys)\n''',
              '''        self.assertIn("enhancement", keys)\n        self.assertIn("rife_base", keys)\n        self.assertNotIn("rife_final", keys)\n''',
              1,
          )
          t = t.replace(
              '''        self.assertAlmostEqual(long_by_key["vfx"].duration_seconds, 264.0)\n        self.assertGreater(long_by_key["vfx"].persistent_gb, short_by_key["vfx"].persistent_gb * 20)\n        self.assertLess(long.peak_scratch_gb, 100.0)\n''',
              '''        self.assertAlmostEqual(long_by_key["vfx"].duration_seconds, 264.0)\n        self.assertEqual(long_by_key["vfx"].persistent_gb, 0.0)\n        self.assertEqual(long_by_key["vfx"].working_set_gb, 0.0)\n        self.assertIn("streaming direto", long_by_key["vfx"].detail)\n        self.assertLess(long.peak_scratch_gb, 100.0)\n''',
              1,
          )
          tests.write_text(t, encoding='utf-8')

          plan_tests = Path('tests/test_render_plan.py')
          pt = plan_tests.read_text(encoding='utf-8-sig')
          pt = pt.replace(
              '''        self.assertEqual(plan.metadata["rife_calls_planned"], 1)\n        self.assertTrue(plan.metadata["rife_loop_optimized"])\n''',
              '''        self.assertEqual(plan.metadata["rife_calls_planned"], 1)\n        self.assertTrue(plan.metadata["rife_loop_optimized"])\n        self.assertFalse(plan.metadata["vfx_delivery_fused"])\n''',
              1,
          )
          marker = '''    def test_original_project_keeps_one_shot_final_rife(self):\n'''
          fused_test = '''    def test_music_vfx_delivery_is_fused_after_loop_rife(self):\n        plan = self._plan(\n            source_fps=24.0, target_fps=120.0, effects_active=True, interpolation_mode="rife",\n        )\n        self.assertTrue(plan.step("rife_base").runs)\n        self.assertFalse(plan.step("rife_final").attempts)\n        self.assertTrue(plan.metadata["vfx_delivery_fused"])\n\n'''
          if pt.count(marker) != 1:
              raise SystemExit('test_render_plan marker mismatch')
          pt = pt.replace(marker, fused_test + marker, 1)
          plan_tests.write_text(pt, encoding='utf-8')
          PY
