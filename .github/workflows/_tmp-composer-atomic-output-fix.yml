name: Temporary Composer AtomicOutput Fix

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-composer-atomic-output-fix.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -e .
      - name: Patch CPU and CUDA atomic output usage
        shell: python
        run: |
          from pathlib import Path

          cpu = Path('src/cinepulse/composer_export.py')
          text = cpu.read_text(encoding='utf-8')
          old = '''            with AtomicOutput(output) as atomic:\n                mux = subprocess.run(\n                    _mux_command(request, visual, atomic.partial),\n                    stdout=subprocess.PIPE,\n                    stderr=subprocess.PIPE,\n                    check=False,\n                    creationflags=CREATE_NO_WINDOW,\n                )\n                if mux.returncode:\n                    details = (mux.stderr or b"").decode("utf-8", errors="replace").strip()\n                    raise RuntimeError(details or f"composer mux exited with {mux.returncode}")\n                if cancel():\n                    raise InterruptedError("composer export cancelled")\n                atomic.commit()\n'''
          new = '''            atomic = AtomicOutput.for_path(output)\n            atomic.prepare()\n            try:\n                mux = subprocess.run(\n                    _mux_command(request, visual, atomic.partial),\n                    stdout=subprocess.PIPE,\n                    stderr=subprocess.PIPE,\n                    check=False,\n                    creationflags=CREATE_NO_WINDOW,\n                )\n                if mux.returncode:\n                    details = (mux.stderr or b"").decode("utf-8", errors="replace").strip()\n                    raise RuntimeError(details or f"composer mux exited with {mux.returncode}")\n                if cancel():\n                    raise InterruptedError("composer export cancelled")\n                atomic.commit()\n            finally:\n                atomic.discard()\n'''
          if text.count(old) != 1:
              raise SystemExit('CPU AtomicOutput block not found exactly once')
          cpu.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          gpu = Path('src/cinepulse/composer_auto_export.py')
          text = gpu.read_text(encoding='utf-8')
          old = '''        with AtomicOutput(output) as atomic:\n            _run_cancellable(\n                _mux_command(request, visual, atomic.partial),\n                cancelled=cancelled,\n                log=log,\n                stderr_path=mux_log,\n            )\n            if cancelled():\n                raise InterruptedError("composer GPU export cancelled")\n            _verify_gpu_product(request, atomic.partial, expect_audio=expected_audio)\n            atomic.commit()\n'''
          new = '''        atomic = AtomicOutput.for_path(output)\n        atomic.prepare()\n        try:\n            _run_cancellable(\n                _mux_command(request, visual, atomic.partial),\n                cancelled=cancelled,\n                log=log,\n                stderr_path=mux_log,\n            )\n            if cancelled():\n                raise InterruptedError("composer GPU export cancelled")\n            _verify_gpu_product(request, atomic.partial, expect_audio=expected_audio)\n            atomic.commit()\n        finally:\n            atomic.discard()\n'''
          if text.count(old) != 1:
              raise SystemExit('GPU AtomicOutput block not found exactly once')
          gpu.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Lock AtomicOutput caller contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/test_hardware_megapack_final_contract.py')
          text = path.read_text(encoding='utf-8')
          marker = '    def test_h7_is_external_preview_only_and_rolls_back_to_ncnn(self) -> None:\n'
          addition = '''    def test_composer_exports_use_current_atomic_output_factory(self) -> None:\n        cpu = self.text("src/cinepulse/composer_export.py")\n        gpu = self.text("src/cinepulse/composer_auto_export.py")\n        for text in (cpu, gpu):\n            self.assertIn("AtomicOutput.for_path(", text)\n            self.assertIn("atomic.prepare()", text)\n            self.assertIn("atomic.commit()", text)\n            self.assertIn("atomic.discard()", text)\n            self.assertNotIn("with AtomicOutput(", text)\n\n'''
          if marker not in text:
              raise SystemExit('final contract insertion marker missing')
          path.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8', newline='\n')
      - name: Focused tests
        run: |
          python -m compileall -q src/cinepulse/composer_export.py src/cinepulse/composer_auto_export.py
          python -m unittest tests.test_composer_export tests.test_composer_auto_export tests.test_hardware_megapack_final_contract
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/_tmp-composer-atomic-output-fix.yml
          git add src/cinepulse/composer_export.py src/cinepulse/composer_auto_export.py tests/test_hardware_megapack_final_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use current AtomicOutput contract in Composer"
          git push origin HEAD:preview-restoration-lab
