name: Temporary H8 Overnight Runtime Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h8-runtime-wire.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Wire overnight profile into live render runtime
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/cinepulse/studio.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from .performance_policy import clamp_cpu_threads, default_cpu_threads, realesrgan_pipeline_threads\n'
          new_import = 'from .performance_policy import (\n    PROFILE_OVERNIGHT, clamp_cpu_threads, default_cpu_threads, profile_for_threads, realesrgan_pipeline_threads,\n)\n'
          if old_import not in text:
              raise SystemExit('H8 expected performance_policy import not found')
          text = text.replace(old_import, new_import, 1)

          old_mode = '''            dedicated_threshold = max(1, cpu_topology.logical_cpus - (2 if cpu_topology.logical_cpus >= 8 else 1))
              machine_mode = "dedicated" if settings.cpu_threads >= dedicated_threshold else "balanced"
              cpu_tuning = CpuTuningStore(PATHS.cache / "hardware" / "cpu-tuning.json")
          '''
          new_mode = '''            dedicated_threshold = max(1, cpu_topology.logical_cpus - (2 if cpu_topology.logical_cpus >= 8 else 1))
              machine_mode = "dedicated" if settings.cpu_threads >= dedicated_threshold else "balanced"
              machine_profile = profile_for_threads(settings.cpu_threads, cpu_topology.logical_cpus)
              overnight_mode = machine_profile == PROFILE_OVERNIGHT
              cpu_tuning = CpuTuningStore(PATHS.cache / "hardware" / "cpu-tuning.json")
              if overnight_mode:
                  self._log("H8 Overnight: controlador sustentado ativo; somente downshift de recursos é permitido.")
          '''
          if old_mode not in text:
              raise SystemExit('H8 expected machine-mode block not found')
          text = text.replace(old_mode, new_mode, 1)

          old_ai = '''            h5_ai_controller = AdaptiveRuntimeController(
                  gpu_index=0,
                  allow_extract_overlap=realesrgan_budget.overlap_extract,
                  allow_pack_overlap=realesrgan_budget.overlap_pack,
              )
          '''
          new_ai = '''            h5_ai_controller = AdaptiveRuntimeController(
                  gpu_index=0,
                  allow_extract_overlap=realesrgan_budget.overlap_extract,
                  allow_pack_overlap=realesrgan_budget.overlap_pack,
                  overnight=overnight_mode,
                  scratch_sustainable_mbps=neural_headroom.scratch_write_mbps,
              )
          '''
          if old_ai not in text:
              raise SystemExit('H8 expected AI controller block not found')
          text = text.replace(old_ai, new_ai, 1)

          old_rife = '''            h5_rife_controller = AdaptiveRuntimeController(
                  gpu_index=0,
                  allow_extract_overlap=(rife_budget.overlap_extract and not settings.use_cpu),
                  allow_pack_overlap=False,
              )
          '''
          new_rife = '''            h5_rife_controller = AdaptiveRuntimeController(
                  gpu_index=0,
                  allow_extract_overlap=(rife_budget.overlap_extract and not settings.use_cpu),
                  allow_pack_overlap=False,
                  overnight=overnight_mode,
                  scratch_sustainable_mbps=neural_headroom.scratch_write_mbps,
              )
          '''
          if old_rife not in text:
              raise SystemExit('H8 expected RIFE controller block not found')
          text = text.replace(old_rife, new_rife, 1)

          old_log = '''                            f"chunk={decision.chunk_scale:.2f}x, extract_overlap={decision.allow_extract_overlap}, "
                              f"pack_overlap={decision.allow_pack_overlap}. Qualidade/modelo/FPS permanecem inalterados."
          '''
          new_log = '''                            f"chunk={decision.chunk_scale:.2f}x, cpu={decision.cpu_scale:.2f}x, "
                              f"extract_overlap={decision.allow_extract_overlap}, pack_overlap={decision.allow_pack_overlap}, "
                              f"cooldown_hint={decision.cooldown_hint_seconds:.0f}s. Qualidade/modelo/FPS permanecem inalterados."
          '''
          if old_log not in text:
              raise SystemExit('H8 expected downshift log block not found')
          text = text.replace(old_log, new_log, 1)

          old_decision = '''                    active_chunk_frames = decision.limit_chunk_frames(chunk_frames)
                  else:
                      active_chunk_frames = chunk_frames
                  count = min(active_chunk_frames, total_frames - processed)
          '''
          new_decision = '''                    active_chunk_frames = decision.limit_chunk_frames(chunk_frames)
                      active_cpu_threads = decision.limit_cpu_threads(cpu_threads)
                  else:
                      active_chunk_frames = chunk_frames
                      active_cpu_threads = cpu_threads
                  count = min(active_chunk_frames, total_frames - processed)
          '''
          if old_decision not in text:
              raise SystemExit('H8 expected Real-ESRGAN runtime decision block not found')
          text = text.replace(old_decision, new_decision, 1)

          old_pack_threads = '                    "-pix_fmt", "yuv420p", "-threads", str(cpu_threads),\n'
          new_pack_threads = '                    "-pix_fmt", "yuv420p", "-threads", str(active_cpu_threads),\n'
          if old_pack_threads not in text:
              raise SystemExit('H8 expected Real-ESRGAN pack thread argument not found')
          text = text.replace(old_pack_threads, new_pack_threads, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Focused H8 contract tests
        run: |
          python -m compileall -q src tests
          python -m unittest -v tests.test_adaptive_runtime tests.test_overnight_runtime tests.test_h8_adaptive_integration tests.test_h4_overlap_contract tests.test_h5_runtime_integration
      - name: Assert live H8 wiring
        shell: python
        run: |
          from pathlib import Path
          text = Path('src/cinepulse/studio.py').read_text(encoding='utf-8')
          required = (
              'machine_profile = profile_for_threads',
              'overnight=overnight_mode',
              'scratch_sustainable_mbps=neural_headroom.scratch_write_mbps',
              'active_cpu_threads = decision.limit_cpu_threads(cpu_threads)',
              'str(active_cpu_threads)',
          )
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'H8 live wiring missing: {missing}')
      - name: Commit integrated runtime and remove temporary writer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-h8-runtime-wire.yml
          git add src/cinepulse/studio.py
          git commit -m "Hardware H8: wire sustained overnight controller into render runtime"
          git push origin preview-restoration-lab
