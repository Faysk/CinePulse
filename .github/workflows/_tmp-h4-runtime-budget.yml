name: Temporary Hardware H4 Runtime Budget Integrator

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-h4-runtime-budget.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch Studio
        run: python scripts/_tmp_h4_integrate.py
      - name: Focused H4 tests
        run: |
          python -m pip install --disable-pip-version-check --editable .
          python -m unittest discover -s tests -p 'test_pipeline_budget.py'
          python -m unittest discover -s tests -p 'test_pipeline_runtime.py'
          python -m unittest discover -s tests -p 'test_realesrgan_tuning.py'
          python -m unittest discover -s tests -p 'test_rife_tuning.py'
          python -m unittest discover -s tests -p 'test_rife_safe_runner.py'
          python -m compileall -q src/cinepulse
      - name: Commit integration and remove temporary writers
        shell: bash
        run: |
          git config user.name "CinePulse Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp-h4-runtime-budget.yml scripts/_tmp_h4_integrate.py
          git add src/cinepulse/studio.py
          git commit -m "Hardware H4: apply live budgets to neural chunks"
          git push origin HEAD:preview-restoration-lab
