name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer da release (deve coincidir com o código)
        required: true
        default: 1.1.2
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'src/**'
      - 'installer/**'
      - 'scripts/**'
      - 'requirements*.lock'
      - 'requirements-neural.in'
      - '.github/workflows/release-candidate.yml'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-release-gate:
    name: Windows release gate
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Faysk')
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Resolve and verify release version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ProjectVersion = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $ProjectVersion) { throw 'Unable to read pyproject version.' }
          $Text = Get-Content -LiteralPath 'src/cinepulse/__init__.py' -Raw
          $Match = [regex]::Match($Text, '__version__\s*=\s*"([^"]+)"')
          if (-not $Match.Success) { throw 'Unable to resolve package version.' }
          $PackageVersion = $Match.Groups[1].Value
          if ($ProjectVersion -ne $PackageVersion) { throw "Version mismatch: pyproject=$ProjectVersion package=$PackageVersion" }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $Version = $ProjectVersion
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $Version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($Version -ne $ProjectVersion) { throw "Tag version $Version does not match repository version $ProjectVersion" }
          } else {
            $Version = $env:REQUESTED_VERSION
            if (-not $Version) { throw 'Release version is empty.' }
            if ($Version -ne $ProjectVersion) { throw "Requested version $Version does not match repository version $ProjectVersion" }
          }
          if ($Version -notmatch '^\d+\.\d+\.\d+$') { throw "Stable RC requires x.y.z SemVer, got $Version" }
          "CINEPULSE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "CINEPULSE_RELEASE_VERSION=$Version"
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed.' }
      - name: Install locked project runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest install failed' }
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'hash-locked core runtime install failed' }
          python -m pip install --disable-pip-version-check --no-deps --editable .
          if ($LASTEXITCODE -ne 0) { throw 'CinePulse editable install failed' }
          python -c "import cinepulse, numpy, os, sys; assert cinepulse.__version__ == os.environ['CINEPULSE_VERSION']; print('CINEPULSE_RELEASE_RUNTIME', cinepulse.__version__, sys.version.split()[0], numpy.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'locked runtime import proof failed' }
      - name: Release light gate
        run: python scripts/ci_gate.py --profile release-light --output artifacts/ci/release-windows.json
      - name: PowerShell release contract
        shell: pwsh
        run: ./scripts/Test-Release.ps1
      - name: Self-contained installer contract
        run: python -m pytest -q tests/test_installer_v2_contract.py
      - name: Prove isolated temp and caches
        shell: pwsh
        run: ./scripts/Test-IsolatedEnvironment.ps1 -Python (Get-Command python).Source
      - name: Prove neural hash lock on release Python
        shell: pwsh
        run: ./scripts/Test-NeuralInstaller.ps1 -Python (Get-Command python).Source
      - name: Build portable
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Version $env:CINEPULSE_VERSION -BuildPython (Get-Command python).Source -SkipTests
      - name: Test portable updater/apply
        shell: pwsh
        run: ./scripts/Test-Updater.ps1 -Version $env:CINEPULSE_VERSION
      - name: Build MSI
        shell: pwsh
        run: ./scripts/Build-Msi.ps1 -Version $env:CINEPULSE_VERSION -BuildPython (Get-Command python).Source -SkipTests
      - name: Validate MSI payload
        shell: pwsh
        run: ./scripts/Test-Msi.ps1 -Version $env:CINEPULSE_VERSION
      - name: Install, repair and uninstall MSI
        shell: pwsh
        env:
          CINEPULSE_CI_ALLOW_MSI_LIFECYCLE: '1'
        run: ./scripts/Test-MsiLifecycle.ps1 -Version $env:CINEPULSE_VERSION
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinepulse-release-candidate-${{ env.CINEPULSE_VERSION }}
          path: |
            artifacts/ci/*.json
            dist/CinePulse-*.zip
            dist/CinePulse-*.msi
            dist/*manifest*.json
            dist/*.minisig
          if-no-files-found: warn
          retention-days: 14
