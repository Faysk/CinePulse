name: Temporary Preview Composer Runtime Test

on:
  push:
    branches: [preview-restoration-lab]
    paths:
      - .github/workflows/_tmp-composer-runtime-test.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview-restoration-lab
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --editable .
      - name: Focused composer runtime gate
        run: |
          python -m compileall -q src/cinepulse/composer_runtime.py src/cinepulse/composer_media.py src/cinepulse/overlay_composer.py src/cinepulse/visualizer_geometry.py src/cinepulse/visualizer_renderer.py src/cinepulse/ui/composer_view.py
          python -m unittest tests.test_composer_runtime tests.test_composer_media tests.test_overlay_composer tests.test_visualizer_geometry tests.test_visualizer_renderer tests.test_gpu_compositor
      - name: Remove temporary writer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_tmp-composer-runtime-test.yml
          git commit -m "chore: remove temporary composer runtime gate"
          git push origin HEAD:preview-restoration-lab
